<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soulfeild</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud {
            position: fixed; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 16px 20px;
            color: #c0d8e0; font-family: 'Courier New', monospace;
            font-size: 13px; z-index: 90; min-width: 160px;
            pointer-events: none; user-select: none;
        }
        #hud .hud-title {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; opacity: 0.5;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px; margin-bottom: 8px;
        }
        .hud-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .hud-row .label { opacity: 0.4; font-size: 11px; }
        .hud-row .value { font-weight: bold; }
        .plt-profit .value { color: #ffb347; }
        .plt-love .value { color: #ff6b9d; }
        .plt-tax .value { color: #4ecdc4; }
        .plt-total .value { color: #e0e8ff; font-size: 16px; }
        .hud-divider { border-top: 1px solid rgba(255,255,255,0.06); margin: 4px 0; }

        #terminal {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 86%; max-width: 800px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 12px 16px;
            color: #b0d0e0; font-size: 14px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        #terminal-output {
            max-height: 120px; overflow-y: auto;
            margin-bottom: 6px; line-height: 1.5;
            scrollbar-width: thin; scrollbar-color: #4a6a8a transparent;
        }
        #terminal-output::-webkit-scrollbar { width: 4px; }
        #terminal-output::-webkit-scrollbar-thumb { background: #4a6a8a; border-radius: 8px; }
        .term-line .hl { color: #f0c060; }
        .term-line .ok { color: #60d0a0; }
        .term-line .err { color: #e06060; }
        .term-line .dim { opacity: 0.5; }
        #terminal-input-line {
            display: flex; align-items: center; gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 6px;
        }
        #terminal-prompt { color: #8ab0d0; font-weight: bold; }
        #terminal-input {
            flex: 1; background: transparent; border: none;
            color: #e0f0f8; font: inherit; outline: none; padding: 4px 0;
        }
        #terminal-input::placeholder { color: #3a5a6a; font-style: italic; }

        @media (max-width: 640px) {
            #terminal { width: 94%; bottom: 14px; padding: 10px 12px; font-size: 12px; }
            #hud { top: 12px; right: 12px; padding: 12px 14px; font-size: 11px; min-width: 120px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-title">⟡ Soulfeild Pulse</div>
        <div class="hud-row plt-profit"><span class="label">Profit</span><span class="value" id="hud-profit">0.50</span></div>
        <div class="hud-row plt-love"><span class="label">Love</span><span class="value" id="hud-love">0.50</span></div>
        <div class="hud-row plt-tax"><span class="label">Tax</span><span class="value" id="hud-tax">0.50</span></div>
        <div class="hud-divider"></div>
        <div class="hud-row plt-total"><span class="label">PLT</span><span class="value" id="hud-total">0.50</span></div>
    </div>

    <div id="terminal">
        <div id="terminal-output">
            <div class="term-line">> <span class="hl">The Soulfeild</span> v1.0</div>
            <div class="term-line">> Click a building to enter. Explore the cosmos.</div>
        </div>
        <div id="terminal-input-line">
            <span id="terminal-prompt">❯</span>
            <input id="terminal-input" type="text" placeholder="command..." autofocus />
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <script>
        const BABYLON = window.BABYLON;

        // ------------------------------------------------------------
        //  STATE
        // ------------------------------------------------------------
        const PLT = {
            profit: 0.55, love: 0.45, tax: 0.50,
            get total() {
                return Math.min(1, Math.max(0, this.profit + this.love - this.tax));
            },
            get skyColor() {
                const p = this.profit, l = this.love, t = this.tax;
                const maxV = Math.max(p, l, t);
                let r, g, b;
                if (maxV === p && maxV > 0.15) {
                    r = 1.0; g = 0.6 + 0.4 * ((p - 0.3) * 2); b = 0.1;
                } else if (maxV === l && maxV > 0.15) {
                    r = 1.0; g = 0.2 + 0.5 * ((l - 0.3) * 2); b = 0.5 + 0.4 * ((l - 0.3) * 2);
                } else if (maxV === t && maxV > 0.15) {
                    r = 0.1; g = 0.6 + 0.4 * ((t - 0.3) * 2); b = 0.8 + 0.2 * ((t - 0.3) * 2);
                } else {
                    r = 0.04; g = 0.02; b = 0.10;
                }
                const base = { r: 0.03, g: 0.01, b: 0.07 };
                const mix = Math.min(1, maxV * 2.0);
                return {
                    r: base.r + (r - base.r) * mix,
                    g: base.g + (g - base.g) * mix,
                    b: base.b + (b - base.b) * mix
                };
            }
        };

        const state = {
            mode: 'city',
            buildings: [],
            citizens: [],
            interiorMeshes: [],
            isTransitioning: false,
            timeScale: 1,
            paused: false,
        };

        // ------------------------------------------------------------
        //  BABYLON SETUP
        // ------------------------------------------------------------
        try {
        const canvas = document.createElement('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        document.getElementById('canvas-container').appendChild(canvas);

        const engine = new BABYLON.Engine(canvas, true, {
            preserveDrawingBuffer: true,
            stencil: true,
            antialiasing: true,
            useLargeWorldRendering: true,
        });
        engine.resize();

        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0.03, 0.01, 0.07);

        const camera = new BABYLON.FreeCamera('camera', new BABYLON.Vector3(0, 22, -38), scene);
        camera.setTarget(BABYLON.Vector3.Zero());
        camera.attachControl(canvas, true);
        camera.speed = 14;
        camera.angularSensibility = 4000;
        camera.minZ = 0.1;
        camera.maxZ = 20000;

        // ---- RENDERING PIPELINE ----
        let pipeline;
        try {
            pipeline = new BABYLON.DefaultRenderingPipeline('pipeline', true, scene, [camera]);
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.15;
            pipeline.bloomWeight = 1.6;
            pipeline.bloomKernel = 48;
            pipeline.bloomScale = 0.5;
            pipeline.fxaaEnabled = true;
            if (pipeline.depthOfField) {
                pipeline.depthOfFieldEnabled = true;
                pipeline.depthOfField.focusDistance = 3000;
                pipeline.depthOfField.focalLength = 50;
                pipeline.depthOfField.fStop = 1.8;
            }
            pipeline.vignetteEnabled = true;
            pipeline.vignetteWeight = 1.0;
            pipeline.sharpeningEnabled = true;
            pipeline.sharpening = 0.3;
        } catch (e) {
            console.warn('Pipeline skipped:', e);
        }

        // ---- LIGHTS ----
        const ambient = new BABYLON.HemisphericLight('ambient', new BABYLON.Vector3(0, 1, 0), scene);
        ambient.intensity = 0.15;
        ambient.diffuse = new BABYLON.Color3(0.3, 0.15, 0.5);

        const sunLight = new BABYLON.DirectionalLight('sunLight', new BABYLON.Vector3(0.5, -1, 0.3), scene);
        sunLight.intensity = 0.6;
        sunLight.diffuse = new BABYLON.Color3(0.8, 0.6, 1);

        // ---- ENVIRONMENT (Reflections) ----
        let envTexture = null;
        try {
            envTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(
                "https://assets.babylonjs.com/environments/studio.env",
                scene
            );
        } catch (e) {
            console.warn('HDR env skipped:', e);
        }

        // ---- GROUND (reflective) ----
        const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 180, height: 180 }, scene);
        const groundMat = new BABYLON.PBRMaterial('groundMat', scene);
        groundMat.albedoColor = new BABYLON.Color3(0.01, 0.01, 0.03);
        groundMat.roughness = 0.4;
        groundMat.metallic = 0.9;
        groundMat.environmentTexture = envTexture;
        groundMat.environmentIntensity = 0.6;
        groundMat.reflectivityColor = new BABYLON.Color3(0.1, 0.1, 0.2);
        groundMat.clearCoat = 0.3;
        ground.material = groundMat;

        // ---- GRID (neon) ----
        const gridHelper = BABYLON.MeshBuilder.CreateGround('grid', { width: 150, height: 150, subdivisions: 16 }, scene);
        const gridMat = new BABYLON.StandardMaterial('gridMat', scene);
        gridMat.wireframe = true;
        gridMat.emissiveColor = new BABYLON.Color3(0.15, 0.06, 0.3);
        gridMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
        gridMat.alpha = 0.2;
        gridHelper.position.y = 0.05;
        gridHelper.material = gridMat;

        // ---- FOG ----
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
        scene.fogDensity = 0.003;
        scene.fogColor = new BABYLON.Color3(0.04, 0.02, 0.10);

        // ---- OCTREE OPTIMIZATION ----
        scene.createOrUpdateSelectionOctree(64, 2);
        scene.freezeActiveMeshes();

        // ------------------------------------------------------------
        //  SOLAR SYSTEM
        // ------------------------------------------------------------
        function createSolarSystem() {
            const sun = BABYLON.MeshBuilder.CreateSphere('sun', { diameter: 10, segments: 32 }, scene);
            sun.position = new BABYLON.Vector3(0, 80, -150);
            const sunMat = new BABYLON.PBRMaterial('sunMat', scene);
            sunMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.2);
            sunMat.emissiveIntensity = 5;
            sunMat.albedoColor = new BABYLON.Color3(0.8, 0.6, 0.1);
            sunMat.roughness = 0.1;
            sun.material = sunMat;

            const spriteMgr = new BABYLON.SpriteManager('sunGlow', '', 1, 60, scene);
            const glow = new BABYLON.Sprite('sunGlow', spriteMgr);
            glow.position = sun.position.clone();
            glow.size = 50;
            glow.color = new BABYLON.Color4(1, 0.7, 0.2, 0.2);

            const planetData = [
                { radius: 20, color: [0.9, 0.3, 0.2], size: 1.2, speed: 0.35 },
                { radius: 28, color: [0.2, 0.7, 0.9], size: 1.8, speed: 0.25 },
                { radius: 38, color: [0.9, 0.6, 0.1], size: 2.2, speed: 0.18 },
                { radius: 50, color: [0.4, 0.3, 0.7], size: 1.6, speed: 0.12 },
                { radius: 65, color: [0.3, 0.7, 0.5], size: 2.0, speed: 0.08 },
            ];
            planetData.forEach((data, idx) => {
                const pivot = new BABYLON.TransformNode(`orbitPivot_${idx}`);
                pivot.position = sun.position.clone();
                const planet = BABYLON.MeshBuilder.CreateSphere(`planet_${idx}`, { diameter: data.size }, scene);
                planet.position = new BABYLON.Vector3(data.radius, 0, 0);
                planet.parent = pivot;
                const mat = new BABYLON.PBRMaterial(`planetMat_${idx}`, scene);
                mat.albedoColor = new BABYLON.Color3(data.color[0], data.color[1], data.color[2]);
                mat.emissiveColor = new BABYLON.Color3(data.color[0]*0.15, data.color[1]*0.15, data.color[2]*0.15);
                mat.roughness = 0.4; mat.metallic = 0.3;
                mat.environmentTexture = envTexture;
                planet.material = mat;

                if (idx === 2) {
                    const moonPivot = new BABYLON.TransformNode('moonPivot');
                    moonPivot.parent = planet;
                    moonPivot.position = new BABYLON.Vector3(0, 0, 0);
                    const moon = BABYLON.MeshBuilder.CreateSphere('moon', { diameter: 0.7 }, scene);
                    moon.position = new BABYLON.Vector3(3.0, 0, 0);
                    moon.parent = moonPivot;
                    const moonMat = new BABYLON.PBRMaterial('moonMat', scene);
                    moonMat.albedoColor = new BABYLON.Color3(0.6, 0.6, 0.7);
                    moonMat.roughness = 0.8;
                    moon.material = moonMat;
                    const moonAnim = new BABYLON.Animation('moonOrbit', 'rotation.y', 30,
                        BABYLON.Animation.ANIMATIONTYPE_FLOAT,
                        BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
                    moonAnim.setKeys([{ frame: 0, value: 0 }, { frame: 60, value: Math.PI*2 }]);
                    moonPivot.animations.push(moonAnim);
                    scene.beginAnimation(moonPivot, 0, 60, true);
                }

                const orbitAnim = new BABYLON.Animation('orbit', 'rotation.y', 30,
                    BABYLON.Animation.ANIMATIONTYPE_FLOAT,
                    BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
                orbitAnim.setKeys([{ frame: 0, value: 0 }, { frame: 120 / data.speed, value: Math.PI*2 }]);
                pivot.animations.push(orbitAnim);
                scene.beginAnimation(pivot, 0, 120 / data.speed, true);
            });
        }
        createSolarSystem();

        // ------------------------------------------------------------
        //  STARFIELD & CONSTELLATIONS
        // ------------------------------------------------------------
        function createStarfield() {
            const starSys = new BABYLON.ParticleSystem('stars', 15000, scene);
            starSys.createSphereEmitter(20000, 0);
            starSys.manualEmitCount = 15000;
            starSys.minLifeTime = Number.MAX_VALUE;
            starSys.maxLifeTime = Number.MAX_VALUE;
            starSys.minSize = 0.2; starSys.maxSize = 0.8;
            starSys.minEmitPower = 0; starSys.maxEmitPower = 0;
            starSys.gravity = new BABYLON.Vector3(0,0,0);
            starSys.color1 = new BABYLON.Color4(0.9, 0.9, 1, 1);
            starSys.color2 = new BABYLON.Color4(0.7, 0.7, 0.9, 0.8);
            starSys.colorDead = new BABYLON.Color4(0,0,0,0);
            starSys.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            starSys.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            starSys.start();

            const constellations = [
                {
                    points: [
                        [-350, 250, -600], [-330, 280, -580], [-310, 260, -570], [-290, 280, -560],
                        [-270, 260, -550], [-290, 230, -560], [-300, 210, -565], [-310, 190, -570]
                    ],
                    color: [0.5, 0.8, 1]
                },
                {
                    points: [
                        [250, 220, -500], [270, 240, -490], [290, 230, -480], [310, 250, -470],
                        [330, 230, -460], [320, 200, -470], [300, 190, -480]
                    ],
                    color: [0.7, 0.9, 1]
                },
                {
                    points: [
                        [400, 300, -700], [380, 320, -690], [360, 310, -680], [340, 330, -670],
                        [320, 310, -660]
                    ],
                    color: [0.9, 0.6, 0.8]
                }
            ];
            constellations.forEach(c => {
                const pts = c.points.map(p => new BABYLON.Vector3(p[0], p[1], p[2]));
                const line = BABYLON.MeshBuilder.CreateLines('constellation', { points: pts }, scene);
                const mat = new BABYLON.LinesMaterial('lineMat', scene);
                mat.color = new BABYLON.Color3(c.color[0], c.color[1], c.color[2]);
                mat.opacity = 0.4;
                line.material = mat;
            });
        }
        createStarfield();

        // ------------------------------------------------------------
        //  CITY BUILDINGS (with interiors)
        // ------------------------------------------------------------
        function createWindowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0a18'; ctx.fillRect(0,0,256,256);
            const cols = 6, rows = 8, gap = 8;
            const w = (256 - gap*(cols+1))/cols;
            const h = (256 - gap*(rows+1))/rows;
            for (let r=0; r<rows; r++) {
                for (let c=0; c<cols; c++) {
                    const x = gap + c*(w+gap);
                    const y = gap + r*(h+gap);
                    const lit = Math.random() > 0.4;
                    const bright = `hsl(${200+Math.random()*40}, 100%, ${lit ? 60 : 15}%)`;
                    ctx.fillStyle = bright;
                    ctx.shadowColor = lit ? 'rgba(100,200,255,0.6)' : 'transparent';
                    ctx.shadowBlur = lit ? 20 : 0;
                    ctx.fillRect(x,y,w,h);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#1a1a3e';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x,y,w,h);
                }
            }
            const tex = new BABYLON.DynamicTexture('winTex', canvas, scene);
            tex.hasAlpha = true;
            return tex;
        }
        const windowTex = createWindowTexture();

        function createBuildingWithInterior(x, z, type) {
            const height = 4 + Math.random() * 4;
            const width = 2.5 + Math.random() * 1.5;
            const depth = 2.5 + Math.random() * 1.5;

            const mesh = BABYLON.MeshBuilder.CreateBox('bld', { width, height, depth }, scene);
            mesh.position = new BABYLON.Vector3(x, height/2, z);
            const mat = new BABYLON.PBRMaterial('bldMat', scene);
            const baseColor = new BABYLON.Color3(0.1+Math.random()*0.2, 0.1+Math.random()*0.2, 0.3+Math.random()*0.3);
            mat.albedoColor = baseColor;
            mat.roughness = 0.4; mat.metallic = 0.5;
            mat.emissiveColor = baseColor.clone().scale(0.2);
            mat.environmentTexture = envTexture;
            mat.albedoTexture = windowTex;
            mat.emissiveTexture = windowTex;
            mat.emissiveIntensity = 0.6;
            mesh.material = mat;
            mesh.freezeWorldMatrix();

            const edgePoints = [
                new BABYLON.Vector3(-width/2, 0.1, -depth/2),
                new BABYLON.Vector3( width/2, 0.1, -depth/2),
                new BABYLON.Vector3( width/2, 0.1,  depth/2),
                new BABYLON.Vector3(-width/2, 0.1,  depth/2),
                new BABYLON.Vector3(-width/2, 0.1, -depth/2)
            ];
            const edgeLine = BABYLON.MeshBuilder.CreateLines('edges', { points: edgePoints }, scene);
            edgeLine.position = new BABYLON.Vector3(x, 0, z);
            const edgeMat = new BABYLON.LinesMaterial('edgeMat', scene);
            edgeMat.color = new BABYLON.Color3(0.7, 0.4, 1);
            edgeMat.opacity = 0.7;
            edgeLine.material = edgeMat;

            // ---- INTERIOR ----
            const interiorGroup = new BABYLON.TransformNode('interior');
            interiorGroup.position = new BABYLON.Vector3(x, 0, z);
            interiorGroup.visibility = 0;

            const roomW = width * 0.8;
            const roomD = depth * 0.8;
            const roomH = height * 0.7;

            const floor = BABYLON.MeshBuilder.CreateBox('floor', { width: roomW, height: 0.08, depth: roomD }, scene);
            floor.position = new BABYLON.Vector3(0, 0.04, 0);
            floor.parent = interiorGroup;
            const floorMat = new BABYLON.PBRMaterial('floorMat', scene);
            floorMat.albedoColor = new BABYLON.Color3(0.08, 0.08, 0.12);
            floorMat.roughness = 0.6; floorMat.metallic = 0.4;
            floor.material = floorMat;

            const wallMat = new BABYLON.PBRMaterial('wallMat', scene);
            wallMat.albedoColor = new BABYLON.Color3(0.12, 0.12, 0.20);
            wallMat.roughness = 0.5; wallMat.metallic = 0.1;
            const wallThick = 0.05;
            const wallPositions = [
                { w: roomW, d: wallThick, x: 0, z: -roomD/2 },
                { w: roomW, d: wallThick, x: 0, z:  roomD/2 },
                { w: wallThick, d: roomD, x: -roomW/2, z: 0 },
                { w: wallThick, d: roomD, x:  roomW/2, z: 0 }
            ];
            wallPositions.forEach(pos => {
                const wall = BABYLON.MeshBuilder.CreateBox('wall', { width: pos.w, height: roomH, depth: pos.d }, scene);
                wall.position = new BABYLON.Vector3(pos.x, roomH/2, pos.z);
                wall.parent = interiorGroup;
                wall.material = wallMat;
                wall.freezeWorldMatrix();
            });

            const ceil = BABYLON.MeshBuilder.CreateBox('ceil', { width: roomW, height: 0.05, depth: roomD }, scene);
            ceil.position = new BABYLON.Vector3(0, roomH, 0);
            ceil.parent = interiorGroup;
            const ceilMat = new BABYLON.PBRMaterial('ceilMat', scene);
            ceilMat.albedoColor = new BABYLON.Color3(0.05, 0.05, 0.10);
            ceilMat.roughness = 0.8;
            ceil.material = ceilMat;

            for (let i=0; i<4; i++) {
                const deskX = -roomW/2 + 0.8 + i * 1.6;
                const deskZ = -roomD/2 + 0.8;
                const desk = BABYLON.MeshBuilder.CreateBox('desk', { width: 0.7, height: 0.06, depth: 0.45 }, scene);
                desk.position = new BABYLON.Vector3(deskX, 0.4, deskZ);
                desk.parent = interiorGroup;
                const deskMat = new BABYLON.PBRMaterial('deskMat', scene);
                deskMat.albedoColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                deskMat.roughness = 0.4; deskMat.metallic = 0.6;
                desk.material = deskMat;
                const legMat = new BABYLON.PBRMaterial('legMat', scene);
                legMat.albedoColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                legMat.metallic = 0.8; legMat.roughness = 0.3;
                for (let lx=-0.25; lx<=0.25; lx+=0.5) {
                    for (let lz=-0.15; lz<=0.15; lz+=0.3) {
                        const leg = BABYLON.MeshBuilder.CreateCylinder('leg', { height: 0.35, diameter: 0.03 }, scene);
                        leg.position = new BABYLON.Vector3(deskX+lx, 0.175, deskZ+lz);
                        leg.parent = interiorGroup;
                        leg.material = legMat;
                    }
                }
                const screen = BABYLON.MeshBuilder.CreateBox('screen', { width: 0.4, height: 0.3, depth: 0.02 }, scene);
                screen.position = new BABYLON.Vector3(deskX, 0.6, deskZ+0.1);
                screen.parent = interiorGroup;
                const screenMat = new BABYLON.PBRMaterial('screenMat', scene);
                screenMat.emissiveColor = new BABYLON.Color3(0.1+Math.random()*0.3, 0.2+Math.random()*0.3, 0.6+Math.random()*0.4);
                screenMat.emissiveIntensity = 2.5;
                screenMat.albedoColor = new BABYLON.Color3(0.1, 0.1, 0.3);
                screen.material = screenMat;
                const chair = BABYLON.MeshBuilder.CreateCylinder('chair', { height: 0.4, diameter: 0.25 }, scene);
                chair.position = new BABYLON.Vector3(deskX+0.5, 0.2, deskZ-0.3);
                chair.parent = interiorGroup;
                const chairMat = new BABYLON.PBRMaterial('chairMat', scene);
                chairMat.albedoColor = new BABYLON.Color3(0.1, 0.1, 0.15);
                chairMat.roughness = 0.7;
                chair.material = chairMat;
            }

            for (let i=0; i<3; i++) {
                const worker = BABYLON.MeshBuilder.CreateCylinder('worker', { height: 0.7, diameter: 0.2 }, scene);
                const wx = -roomW/2 + 0.6 + i * 2.2;
                const wz = -roomD/2 + 1.6;
                worker.position = new BABYLON.Vector3(wx, 0.35, wz);
                worker.parent = interiorGroup;
                const wMat = new BABYLON.PBRMaterial('wMat', scene);
                const col = new BABYLON.Color3(0.2+Math.random()*0.3, 0.2+Math.random()*0.3, 0.4+Math.random()*0.4);
                wMat.albedoColor = col;
                wMat.emissiveColor = col.clone().scale(0.1);
                wMat.roughness = 0.3; wMat.metallic = 0.2;
                worker.material = wMat;
                const bobAnim = new BABYLON.Animation('bob', 'position.y', 20,
                    BABYLON.Animation.ANIMATIONTYPE_FLOAT,
                    BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
                bobAnim.setKeys([
                    { frame: 0, value: 0.35 },
                    { frame: 15, value: 0.45 },
                    { frame: 30, value: 0.35 }
                ]);
                worker.animations.push(bobAnim);
                scene.beginAnimation(worker, 0, 30, true, 0.5 + Math.random()*0.5);
            }

            const lampLight = new BABYLON.PointLight('lamp', new BABYLON.Vector3(0, roomH-0.2, 0), scene);
            lampLight.parent = interiorGroup;
            lampLight.intensity = 2;
            lampLight.range = 8;
            lampLight.diffuse = new BABYLON.Color3(1, 0.8, 0.6);

            const building = {
                mesh, edgeLine, interiorGroup,
                position: new BABYLON.Vector3(x, 0, z),
                name: `${type} #${state.buildings.length+1}`,
                type,
                isInteriorVisible: false,
                light: lampLight,
            };
            state.buildings.push(building);

            mesh.actionManager = new BABYLON.ActionManager(scene);
            mesh.actionManager.registerAction(
                new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
                    if (!state.isTransitioning) enterBuilding(building);
                })
            );
            return building;
        }

        // ---- GENERATE CITY ----
        const gridSize = 8;
        const spacing = 6.5;
        const offset = (gridSize-1) * spacing / 2;
        for (let ix=0; ix<gridSize; ix++) {
            for (let iz=0; iz<gridSize; iz++) {
                if (ix === Math.floor(gridSize/2) && iz === Math.floor(gridSize/2)) continue;
                if (Math.random() < 0.15) continue;
                const type = ['Office','Office','Shop','Apartment','Tower'][Math.floor(Math.random()*5)];
                const x = ix * spacing - offset + (Math.random()-0.5)*0.6;
                const z = iz * spacing - offset + (Math.random()-0.5)*0.6;
                createBuildingWithInterior(x, z, type);
            }
        }

        // ---- STREET LAMPS WITH POINT LIGHTS ----
        for (let i=0; i<60; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 8 + Math.random() * 30;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const lamp = BABYLON.MeshBuilder.CreateCylinder('lamp', { height: 1.2, diameter: 0.1 }, scene);
            lamp.position = new BABYLON.Vector3(x, 0.6, z);
            const lampMat = new BABYLON.PBRMaterial('lampMat', scene);
            lampMat.emissiveColor = new BABYLON.Color3(0.9, 0.4, 1);
            lampMat.albedoColor = new BABYLON.Color3(0.05, 0.05, 0.1);
            lampMat.roughness = 0.2; lampMat.metallic = 0.8;
            lamp.material = lampMat;
            const pl = new BABYLON.PointLight(`pl_${i}`, new BABYLON.Vector3(x, 1.2, z), scene);
            pl.intensity = 0.4 + Math.random()*0.6;
            pl.diffuse = new BABYLON.Color3(0.6, 0.3, 0.9);
            pl.range = 6;
        }

        // ---- CITIZENS (glowing spheres) ----
        function createCitizen(name) {
            const color = new BABYLON.Color3(0.2+Math.random()*0.8, 0.2+Math.random()*0.8, 0.2+Math.random()*0.8);
            const mesh = BABYLON.MeshBuilder.CreateSphere('cit', { diameter: 0.5 }, scene);
            const angle = Math.random()*Math.PI*2;
            const radius = 5 + Math.random()*28;
            const x = Math.cos(angle)*radius;
            const z = Math.sin(angle)*radius;
            mesh.position = new BABYLON.Vector3(x, 0.25, z);
            const mat = new BABYLON.PBRMaterial('citMat', scene);
            mat.emissiveColor = color;
            mat.albedoColor = color.clone().scale(0.2);
            mat.roughness = 0.1; mat.metallic = 0.1;
            mesh.material = mat;
            const auraMgr = new BABYLON.SpriteManager(`auraMgr_${name}`, '', 1, 20, scene);
            const aura = new BABYLON.Sprite(`aura_${name}`, auraMgr);
            aura.position = mesh.position.clone();
            aura.size = 1.8;
            aura.color = new BABYLON.Color4(color.r, color.g, color.b, 0.3);
            let target = null;
            let timer = 0;
            let nextAction = 2+Math.random()*4;
            return {
                mesh, aura, name, color,
                target, timer, nextAction,
                speed: 1.0 + Math.random()*2.0,
                update(dt) {
                    this.timer += dt;
                    if (this.timer > this.nextAction) {
                        this.timer = 0;
                        this.nextAction = 2+Math.random()*5;
                        const a = Math.random()*Math.PI*2;
                        const r = 4+Math.random()*25;
                        this.target = new BABYLON.Vector3(Math.cos(a)*r, 0.25, Math.sin(a)*r);
                    }
                    if (this.target) {
                        const dir = this.target.subtract(this.mesh.position);
                        const dist = dir.length();
                        if (dist > 0.3) {
                            const move = dir.normalize().scale(this.speed * dt);
                            this.mesh.position.addInPlace(move);
                            this.aura.position.copyFrom(this.mesh.position);
                            const rot = Math.atan2(move.x, move.z);
                            this.mesh.rotation.y = rot;
                        } else {
                            this.target = null;
                        }
                    }
                }
            };
        }
        const citizenNames = ['Elara','Kael','Lyra','Orin','Sera','Dorian','Faye','Gideon','Iris','Jasper','Luna','Milo'];
        const citizens = [];
        for (let i=0; i<30; i++) {
            const name = citizenNames[Math.floor(Math.random()*citizenNames.length)] + (i+1);
            citizens.push(createCitizen(name));
        }
        state.citizens = citizens;

        // ------------------------------------------------------------
        //  ENTER / EXIT BUILDING
        // ------------------------------------------------------------
        let currentInterior = null;
        let savedCamPos = null;
        let savedCamTarget = null;

        function enterBuilding(building) {
            if (state.isTransitioning) return;
            state.isTransitioning = true;

            building.mesh.visibility = 0;
            building.edgeLine.visibility = 0;
            building.interiorGroup.visibility = 1;
            currentInterior = building;

            savedCamPos = camera.position.clone();
            savedCamTarget = camera.getTarget().clone();

            const interiorPos = building.position.clone();
            interiorPos.y = 1.2;
            interiorPos.x += 0.5;
            interiorPos.z += 0.5;

            const posAnim = new BABYLON.Animation('camPos', 'position', 30,
                BABYLON.Animation.ANIMATIONTYPE_VECTOR3,
                BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
            posAnim.setKeys([
                { frame: 0, value: camera.position.clone() },
                { frame: 60, value: interiorPos }
            ]);
            camera.animations.push(posAnim);

            const targetPos = building.position.clone();
            targetPos.y = 1.0;
            scene.beginAnimation(camera, 0, 60, false, 1, () => {
                camera.setTarget(targetPos);
                state.mode = 'interior';
                state.isTransitioning = false;
                terminalLog(`Entered ${building.name}`, 'ok');
            });
        }

        function exitBuilding() {
            if (!currentInterior || state.isTransitioning) return;
            state.isTransitioning = true;

            const building = currentInterior;
            building.mesh.visibility = 1;
            building.edgeLine.visibility = 1;
            building.interiorGroup.visibility = 0;

            const exitPos = savedCamPos || new BABYLON.Vector3(0, 22, -38);
            const exitTarget = savedCamTarget || new BABYLON.Vector3(0, 0, 0);
            const posAnim = new BABYLON.Animation('camPosExit', 'position', 30,
                BABYLON.Animation.ANIMATIONTYPE_VECTOR3,
                BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
            posAnim.setKeys([
                { frame: 0, value: camera.position.clone() },
                { frame: 60, value: exitPos }
            ]);
            camera.animations.push(posAnim);
            scene.beginAnimation(camera, 0, 60, false, 1, () => {
                camera.setTarget(exitTarget);
                currentInterior = null;
                state.mode = 'city';
                state.isTransitioning = false;
                terminalLog('Exited building', 'dim');
            });
        }

        // ------------------------------------------------------------
        //  TERMINAL
        // ------------------------------------------------------------
        const termOutput = document.getElementById('terminal-output');
        const termInput = document.getElementById('terminal-input');

        function terminalLog(msg, cls='') {
            const div = document.createElement('div');
            div.className = 'term-line';
            if (cls) div.classList.add(cls);
            div.innerHTML = `> ${msg}`;
            termOutput.appendChild(div);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        function processCommand(cmd) {
            const parts = cmd.trim().split(' ');
            const main = parts[0].toLowerCase();
            terminalLog(`<span class="hl">${cmd}</span>`);

            switch (main) {
                case 'help':
                    terminalLog('Commands: <span class="hl">plt</span>, <span class="hl">exit</span>, <span class="hl">time</span> [speed], <span class="hl">pause</span>, <span class="hl">resume</span>, <span class="hl">spawn</span>, <span class="hl">build</span> [type], <span class="hl">sky</span>');
                    break;
                case 'plt':
                    terminalLog(`Profit: ${PLT.profit.toFixed(2)}  Love: ${PLT.love.toFixed(2)}  Tax: ${PLT.tax.toFixed(2)}  <span class="hl">Total: ${PLT.total.toFixed(2)}</span>`);
                    break;
                case 'exit':
                    if (state.mode === 'interior') exitBuilding();
                    else terminalLog('Not inside any building.', 'dim');
                    break;
                case 'time':
                    if (parts.length > 1) {
                        const speed = parseFloat(parts[1]);
                        if (!isNaN(speed) && speed > 0) {
                            state.timeScale = speed;
                            terminalLog(`Time scale set to ${speed}x`, 'ok');
                        } else terminalLog('Invalid speed.', 'err');
                    } else terminalLog(`Current time scale: ${state.timeScale}x`);
                    break;
                case 'pause':
                    state.paused = true;
                    scene.animationPlay = false;
                    terminalLog('Paused.', 'dim');
                    break;
                case 'resume':
                    state.paused = false;
                    scene.animationPlay = true;
                    terminalLog('Resumed.', 'ok');
                    break;
                case 'spawn':
                    const name = citizenNames[Math.floor(Math.random()*citizenNames.length)] + (state.citizens.length+1);
                    const c = createCitizen(name);
                    state.citizens.push(c);
                    terminalLog(`Spawned citizen ${name}`, 'ok');
                    break;
                case 'build':
                    if (parts.length > 1 && ['Office','Shop','Apartment','Tower','House'].includes(parts[1])) {
                        const type = parts[1];
                        const angle = Math.random()*Math.PI*2;
                        const radius = 8 + Math.random()*25;
                        const x = Math.cos(angle)*radius;
                        const z = Math.sin(angle)*radius;
                        createBuildingWithInterior(x, z, type);
                        terminalLog(`Built ${type} at (${x.toFixed(1)}, ${z.toFixed(1)})`, 'ok');
                    } else terminalLog('Usage: build [Office|Shop|Apartment|Tower|House]', 'err');
                    break;
                case 'sky':
                    const col = PLT.skyColor;
                    terminalLog(`Sky R:${col.r.toFixed(2)} G:${col.g.toFixed(2)} B:${col.b.toFixed(2)}`);
                    break;
                default:
                    terminalLog(`Unknown command: ${main}. Type help.`, 'err');
            }
            updateHUD();
        }

        // ---- HUD ----
        function updateHUD() {
            document.getElementById('hud-profit').textContent = PLT.profit.toFixed(2);
            document.getElementById('hud-love').textContent = PLT.love.toFixed(2);
            document.getElementById('hud-tax').textContent = PLT.tax.toFixed(2);
            document.getElementById('hud-total').textContent = PLT.total.toFixed(2);
        }
        updateHUD();

        // ---- Terminal events ----
        termInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = termInput.value;
                if (cmd.trim()) processCommand(cmd);
                termInput.value = '';
                setTimeout(() => termInput.focus(), 10);
            }
        });
        canvas.addEventListener('click', () => termInput.focus());

        // ------------------------------------------------------------
        //  WORLD UPDATE
        // ------------------------------------------------------------
        function driftPLT(delta) {
            if (state.paused) return;
            const d = delta * 0.01 * state.timeScale;
            PLT.profit += (Math.random() - 0.5) * d;
            PLT.love += (Math.random() - 0.5) * d;
            PLT.tax += (Math.random() - 0.5) * d;
            PLT.profit = Math.min(1, Math.max(0, PLT.profit));
            PLT.love = Math.min(1, Math.max(0, PLT.love));
            PLT.tax = Math.min(1, Math.max(0, PLT.tax));
            updateHUD();

            const col = PLT.skyColor;
            scene.clearColor = new BABYLON.Color3(col.r, col.g, col.b);
            scene.fogColor = new BABYLON.Color3(col.r * 0.5, col.g * 0.3, col.b * 0.6);
        }

        function updateCitizens(delta) {
            if (state.paused) return;
            const dt = delta * state.timeScale;
            for (const c of state.citizens) {
                c.update(dt);
            }
        }

        // ---- SCENE LOOP ----
        scene.registerBeforeRender(function() {
            const delta = engine.getDeltaTime() / 1000;
            driftPLT(delta);
            updateCitizens(delta);
        });

        // ---- RESIZE ----
        window.addEventListener('resize', () => engine.resize());

        // ---- START ----
        engine.runRenderLoop(() => scene.render());

        // ---- BOOT ----
        terminalLog('The Soulfeild loaded.');
        terminalLog('Click any <span class="hl">building</span> to enter its office.');
        terminalLog('Look up to see planets and constellations.');
        terminalLog('Type <span class="hl">help</span> for commands.');

        console.log('The Soulfeild ready.');
        } catch (e) {
            console.error('Soulfeild init error:', e);
            const el = document.getElementById('terminal-output');
            if (el) el.innerHTML += `<div class="term-line err">> <span class="err">ERROR:</span> ${e.message}</div>`;
        }
    </script>
</body>
</html>
