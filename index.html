<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soulfeild</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; outline: none; }

        #hud {
            position: fixed; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 16px 20px;
            color: #c0d8e0; font-family: 'Courier New', monospace;
            font-size: 13px; z-index: 90; min-width: 160px;
            pointer-events: none; user-select: none;
        }
        #hud .hud-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; margin-bottom: 8px; }
        .hud-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .hud-row .label { opacity: 0.4; font-size: 11px; }
        .hud-row .value { font-weight: bold; }
        .plt-profit .value { color: #ffb347; }
        .plt-love .value { color: #ff6b9d; }
        .plt-tax .value { color: #4ecdc4; }
        .plt-total .value { color: #e0e8ff; font-size: 16px; }
        .plt-heaven .value { color: #fff0a8; text-shadow: 0 0 10px rgba(255, 222, 128, 0.8); }
        .hud-divider { border-top: 1px solid rgba(255,255,255,0.06); margin: 4px 0; }

        #terminal {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 86%; max-width: 800px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;
            padding: 12px 16px; color: #b0d0e0; font-size: 14px;
            font-family: 'Courier New', monospace; z-index: 100;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        #terminal-output { max-height: 120px; overflow-y: auto; margin-bottom: 6px; line-height: 1.5; }
        #terminal-output::-webkit-scrollbar { width: 4px; }
        #terminal-output::-webkit-scrollbar-thumb { background: #4a6a8a; border-radius: 8px; }
        .term-line .hl { color: #f0c060; }
        .term-line .ok { color: #60d0a0; }
        .term-line .err { color: #e06060; }
        .term-line .dim { opacity: 0.5; }
        #terminal-input-line { display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 6px; }
        #terminal-prompt { color: #8ab0d0; font-weight: bold; }
        #terminal-input { flex: 1; background: transparent; border: none; color: #e0f0f8; font: inherit; outline: none; padding: 4px 0; }
        #terminal-input::placeholder { color: #3a5a6a; font-style: italic; }
        /* ---- WORLD PORTALS ---- */
        #portal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; pointer-events: none;
        }
        #portal-overlay.active { display: block; pointer-events: auto; }
        #portal-bg {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(16px);
        }
        #portal-frame-wrap {
            position: absolute; top: 5%; left: 5%; width: 90%; height: 90%;
            border-radius: 16px; overflow: hidden;
            background: #000; border: 1px solid rgba(255,170,102,0.3);
        }
        #portal-frame { width: 100%; height: 100%; border: none; }
        #portal-close {
            position: absolute; top: 16px; right: 16px; z-index: 210;
            background: rgba(0,0,0,0.7); border: 1px solid #ff8844;
            color: #ff8844; font-size: 24px; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-family: monospace;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; pointer-events: auto;
        }
        #portal-close:hover { background: #ff8844; color: #000; }
        #portal-loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #ff8844; font-family: monospace; font-size: 14px;
            z-index: 205; pointer-events: none;
        }
        #portal-label {
            position: absolute; top: 16px; left: 16px; z-index: 210;
            color: #ffdd99; font-family: monospace; font-size: 12px;
            opacity: 0.6; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="hud">
        <div class="hud-title">Soulfeild Pulse</div>
        <div class="hud-row plt-profit"><span class="label">Profit</span><span class="value" id="hud-profit">0.50</span></div>
        <div class="hud-row plt-love"><span class="label">Love</span><span class="value" id="hud-love">0.50</span></div>
        <div class="hud-row plt-tax"><span class="label">Tax</span><span class="value" id="hud-tax">0.50</span></div>
        <div class="hud-divider"></div>
        <div class="hud-row plt-total"><span class="label">PLT</span><span class="value" id="hud-total">0.50</span></div>
        <div class="hud-row plt-heaven"><span class="label">Heaven</span><span class="value" id="hud-heaven">0.72</span></div>
    </div>

    <div id="terminal">
        <div id="terminal-output">
            <div class="term-line">> <span class="hl">The Soulfeild</span> v1.0</div>
            <div class="term-line">> Click a building to enter. Explore the cosmos.</div>
        </div>
        <div id="terminal-input-line">
            <span id="terminal-prompt">></span>
            <input id="terminal-input" type="text" placeholder="command..." autofocus />
        </div>
    </div>

    <!-- WORLD PORTAL OVERLAY -->
    <div id="portal-overlay">
        <div id="portal-bg"></div>
        <div id="portal-loading">Opening portal...</div>
        <div id="portal-label">World Portal</div>
        <div id="portal-frame-wrap">
            <iframe id="portal-frame" allow="autoplay; fullscreen"></iframe>
        </div>
        <button id="portal-close">✕</button>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
    const B = window.BABYLON;
    window.addEventListener('error', (event) => {
        const out = document.getElementById('terminal-output');
        if (out) {
            const d = document.createElement('div');
            d.className = 'term-line err';
            d.innerHTML = '> ERROR: ' + event.message + ' @ line ' + event.lineno;
            out.appendChild(d);
        }
    });
    const canvas = document.getElementById('renderCanvas');
    const engine = new B.Engine(canvas, true, { antialiasing: true });
    const scene = new B.Scene(engine);
    scene.clearColor = new B.Color3(0.02, 0.01, 0.05);

    // Camera -- ArcRotate for nice orbit
    const camera = new B.ArcRotateCamera('cam', -Math.PI / 2.45, Math.PI / 3.15, 82, B.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 5;
    camera.upperRadiusLimit = 320;
    camera.wheelDeltaPercentage = 0.01;

    // Lights
    const hemi = new B.HemisphericLight('hemi', new B.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.3;
    hemi.groundColor = new B.Color3(0.1, 0.05, 0.2);
    
    // Portal glow lights (one for each)
    const portalLights = [];
    const dir = new B.DirectionalLight('dir', new B.Vector3(0.5, -1, 0.3), scene);
    dir.intensity = 0.8;

    // Bloom
    const pipe = new B.DefaultRenderingPipeline('pipe', true, scene, [camera]);
    pipe.bloomEnabled = true;
    pipe.bloomThreshold = 0.3;
    pipe.bloomWeight = 0.8;
    pipe.bloomKernel = 32;
    pipe.fxaaEnabled = true;
    pipe.depthOfFieldEnabled = false;
    pipe.vignetteEnabled = true;
    pipe.vignetteWeight = 0.8;

    // ---- GROUND ----
    const ground = B.MeshBuilder.CreateGround('ground', { width: 200, height: 200 }, scene);
    const gMat = new B.StandardMaterial('gMat', scene);
    gMat.diffuseColor = new B.Color3(0.02, 0.02, 0.04);
    gMat.specularColor = new B.Color3(0.1, 0.1, 0.2);
    gMat.emissiveColor = new B.Color3(0.01, 0.005, 0.02);
    ground.material = gMat;

    // ---- NEON GRID ----
    const grid = B.MeshBuilder.CreateGround('grid', { width: 160, height: 160, subdivisions: 20 }, scene);
    const gridMat = new B.StandardMaterial('gridMat', scene);
    gridMat.wireframe = true;
    gridMat.emissiveColor = new B.Color3(0.1, 0.04, 0.2);
    gridMat.diffuseColor = new B.Color3(0, 0, 0);
    gridMat.alpha = 0.3;
    grid.position.y = 0.02;
    grid.material = gridMat;

    // ---- ROADS ----
    const roadMat = new B.StandardMaterial('roadMat', scene);
    roadMat.diffuseColor = new B.Color3(0.01, 0.01, 0.018);
    roadMat.emissiveColor = new B.Color3(0.006, 0.004, 0.014);
    roadMat.specularColor = new B.Color3(0.08, 0.05, 0.12);
    for (let i = -5; i <= 5; i++) {
        const a = i * 14;
        const roadX = B.MeshBuilder.CreateBox('roadX' + i, { width: 180, height: 0.04, depth: 2.6 }, scene);
        roadX.position = new B.Vector3(0, 0.04, a);
        roadX.material = roadMat;
        const roadZ = B.MeshBuilder.CreateBox('roadZ' + i, { width: 2.6, height: 0.04, depth: 180 }, scene);
        roadZ.position = new B.Vector3(a, 0.045, 0);
        roadZ.material = roadMat;
    }

    // ---- FOG (subtle) ----
    scene.fogMode = B.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.003;
    scene.fogColor = new B.Color3(0.02, 0.01, 0.05);

    // ---- COSMIC SKY ----
    const skyDome = B.MeshBuilder.CreateSphere('skyDome', { diameter: 900, segments: 24 }, scene);
    const skyMat = new B.StandardMaterial('skyMat', scene);
    skyMat.disableLighting = true;
    skyMat.backFaceCulling = false;
    skyMat.diffuseColor = new B.Color3(0, 0, 0);
    skyMat.emissiveColor = new B.Color3(0.012, 0.004, 0.045);
    skyDome.material = skyMat;
    skyDome.applyFog = false;

    function makeNebula(name, x, y, z, width, height, color, alpha) {
        const n = B.MeshBuilder.CreatePlane(name, { width, height }, scene);
        n.position = new B.Vector3(x, y, z);
        n.rotation.y = x > 0 ? -0.35 : 0.35;
        const m = new B.StandardMaterial(name + 'Mat', scene);
        m.disableLighting = true;
        m.backFaceCulling = false;
        m.diffuseColor = new B.Color3(0, 0, 0);
        m.emissiveColor = color;
        m.alpha = alpha;
        n.material = m;
        n.applyFog = false;
    }
    makeNebula('violetNebula', -80, 70, -135, 120, 65, new B.Color3(0.45, 0.12, 0.8), 0.18);
    makeNebula('cyanNebula', 90, 85, -160, 130, 70, new B.Color3(0.08, 0.45, 0.8), 0.15);
    makeNebula('roseNebula', 15, 110, -190, 110, 55, new B.Color3(0.75, 0.12, 0.45), 0.13);

    // ---- STARS ----
    const stars = new B.ParticleSystem('stars', 12000, scene);
    stars.particleTexture = new B.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
    stars.createSphereEmitter(15000, 0);
    stars.manualEmitCount = 12000;
    stars.minLifeTime = 999999;
    stars.maxLifeTime = 999999;
    stars.minSize = 1;
    stars.maxSize = 4;
    stars.minEmitPower = 0;
    stars.maxEmitPower = 0;
    stars.color1 = new B.Color4(0.9, 0.9, 1, 1);
    stars.color2 = new B.Color4(0.7, 0.8, 1, 0.8);
    stars.colorDead = new B.Color4(0, 0, 0, 0);
    stars.blendMode = B.ParticleSystem.BLENDMODE_ADD;
    stars.start();

    // ---- SOLAR SYSTEM ----
    const sun = B.MeshBuilder.CreateSphere('sun', { diameter: 18, segments: 24 }, scene);
    sun.position = new B.Vector3(0, 70, -95);
    const sunMat = new B.StandardMaterial('sunMat', scene);
    sunMat.emissiveColor = new B.Color3(1, 0.8, 0.3);
    sunMat.diffuseColor = new B.Color3(0, 0, 0);
    sunMat.specularColor = new B.Color3(0, 0, 0);
    sun.material = sunMat;

    const sunGlow = new B.PointLight('sunLight', sun.position.clone(), scene);
    sunGlow.intensity = 2;
    sunGlow.range = 260;
    sunGlow.diffuse = new B.Color3(1, 0.8, 0.4);

    const planetColors = [
        [0.9, 0.3, 0.2], [0.2, 0.7, 0.9], [0.9, 0.6, 0.1],
        [0.4, 0.3, 0.7], [0.3, 0.7, 0.5]
    ];
    const matrixPinkMat = new B.StandardMaterial('matrixPinkMat', scene);
    matrixPinkMat.diffuseColor = new B.Color3(0, 0, 0);
    matrixPinkMat.emissiveColor = new B.Color3(1.0, 0.05, 0.75);
    const planets = [];
    planetColors.forEach((c, i) => {
        const radius = 14 + i * 11;
        const pivot = new B.TransformNode('orbit' + i);
        pivot.position = sun.position.clone();
        const p = B.MeshBuilder.CreateSphere('planet' + i, { diameter: 4 + i * 0.9, segments: 24 }, scene);
        p.position = new B.Vector3(radius, 0, 0);
        p.parent = pivot;
        const pm = new B.StandardMaterial('pm' + i, scene);
        pm.diffuseColor = new B.Color3(c[0], c[1], c[2]);
        pm.emissiveColor = new B.Color3(c[0] * 0.15, c[1] * 0.15, c[2] * 0.15);
        pm.specularColor = new B.Color3(0.1, 0.1, 0.1);
        p.material = pm;
        if (i === 1 || i === 3) {
            const codeRadius = (4 + i * 0.9) / 2 + 0.08;
            for (let k = 0; k < 10; k++) {
                const code = B.MeshBuilder.CreateBox('matrixCode', { width: 0.08, height: 0.5 + Math.random() * 0.8, depth: 0.04 }, scene);
                const angle = (Math.PI * 2 * k) / 10;
                code.position = new B.Vector3(Math.cos(angle) * codeRadius, (Math.random() - 0.5) * (1.3 + i * 0.2), Math.sin(angle) * codeRadius);
                code.rotation.y = angle;
                code.parent = p;
                code.material = matrixPinkMat;
            }
        }
        planets.push({ pivot, speed: 0.3 - i * 0.04 });
    });

    // Horizon planet: a huge visible anchor so the sky feels intentional.
    const horizonPlanet = B.MeshBuilder.CreateSphere('horizonPlanet', { diameter: 46, segments: 32 }, scene);
    horizonPlanet.position = new B.Vector3(90, 58, -150);
    const hpMat = new B.StandardMaterial('horizonPlanetMat', scene);
    hpMat.diffuseColor = new B.Color3(0.08, 0.14, 0.28);
    hpMat.emissiveColor = new B.Color3(0.04, 0.08, 0.22);
    hpMat.specularColor = new B.Color3(0.1, 0.16, 0.3);
    horizonPlanet.material = hpMat;

    const horizonRing = B.MeshBuilder.CreateTorus('horizonRing', { diameter: 58, thickness: 0.35, tessellation: 80 }, scene);
    horizonRing.position = horizonPlanet.position.clone();
    horizonRing.rotation.x = 1.05;
    horizonRing.rotation.z = 0.35;
    const ringMat = new B.StandardMaterial('horizonRingMat', scene);
    ringMat.diffuseColor = new B.Color3(0, 0, 0);
    ringMat.emissiveColor = new B.Color3(0.18, 0.35, 0.9);
    ringMat.alpha = 0.65;
    horizonRing.material = ringMat;

    function makeInteractive(mesh, label, detail, onPick) {
        if (!mesh) return;
        mesh.actionManager = new B.ActionManager(scene);
        mesh.actionManager.registerAction(new B.ExecuteCodeAction(B.ActionManager.OnPickTrigger, () => {
            terminalLog('<span class="hl">' + label + '</span> — ' + detail, 'ok');
            if (onPick) onPick(mesh);
        }));
    }

    function makePlanetMovable(mesh, label, followers) {
        makeInteractive(mesh, label, 'drag this planet to move it through the sky');
        if (!B.PointerDragBehavior) return;
        try {
            const drag = new B.PointerDragBehavior({ dragPlaneNormal: new B.Vector3(0, 1, 0) });
            drag.useObjectOrientationForDragging = false;
            drag.onDragStartObservable.add(() => terminalLog('Moving <span class="hl">' + label + '</span>', 'dim'));
            drag.onDragObservable.add(() => {
                if (followers) followers.forEach(f => f.position = mesh.position.clone());
            });
            mesh.addBehavior(drag);
        } catch (e) {
            terminalLog('Planet drag unavailable: ' + e.message, 'err');
        }
    }

    makePlanetMovable(horizonPlanet, 'Horizon Ringworld', [horizonRing]);

    // More sky planets: different colors, sizes, rings, and positions make the sky feel like its own city.
    const skyPlanetDefs = [
        { pos: [-110, 82, -115], size: 18, color: [0.7, 0.12, 0.35], ring: true },
        { pos: [48, 108, -185], size: 12, color: [0.15, 0.75, 0.8], ring: false },
        { pos: [-35, 135, -240], size: 9, color: [0.95, 0.65, 0.15], ring: false },
        { pos: [128, 92, -210], size: 15, color: [0.25, 0.2, 0.75], ring: true },
    ];
    const skyPlanets = [];
    skyPlanetDefs.forEach((def, i) => {
        const sp = B.MeshBuilder.CreateSphere('skyPlanet' + i, { diameter: def.size, segments: 24 }, scene);
        sp.position = new B.Vector3(def.pos[0], def.pos[1], def.pos[2]);
        const sm = new B.StandardMaterial('skyPlanetMat' + i, scene);
        sm.diffuseColor = new B.Color3(def.color[0] * 0.35, def.color[1] * 0.35, def.color[2] * 0.35);
        sm.emissiveColor = new B.Color3(def.color[0] * 0.12, def.color[1] * 0.12, def.color[2] * 0.12);
        sm.specularColor = new B.Color3(0.1, 0.1, 0.15);
        sp.material = sm;
        let sr = null;
        if (def.ring) {
            sr = B.MeshBuilder.CreateTorus('skyPlanetRing' + i, { diameter: def.size * 1.45, thickness: 0.18, tessellation: 64 }, scene);
            sr.position = sp.position.clone();
            sr.rotation.x = 1.15;
            sr.rotation.z = i * 0.4;
            sr.material = ringMat;
        }
        makePlanetMovable(sp, 'Sky Planet ' + (i + 1), sr ? [sr] : []);
        skyPlanets.push({ mesh: sp, ring: sr, spin: 0.03 + i * 0.015 });
    });

    // Flying ships, built from primitive geometry so they are safe and movable.
    const shipMat = new B.StandardMaterial('shipMat', scene);
    shipMat.diffuseColor = new B.Color3(0.05, 0.06, 0.12);
    shipMat.emissiveColor = new B.Color3(0.03, 0.08, 0.18);
    const shipGlowMat = new B.StandardMaterial('shipGlowMat', scene);
    shipGlowMat.diffuseColor = new B.Color3(0, 0, 0);
    shipGlowMat.emissiveColor = new B.Color3(0.2, 0.8, 1.0);
    const ships = [];
    for (let i = 0; i < 12; i++) {
        const ship = new B.TransformNode('ship' + i);
        const body = B.MeshBuilder.CreateBox('shipBody', { width: 1.4, height: 0.28, depth: 0.55 }, scene);
        body.parent = ship;
        body.material = shipMat;
        makeInteractive(body, 'Skyship ' + (i + 1), 'cargo vessel crossing between planets');
        const wingL = B.MeshBuilder.CreateBox('shipWingL', { width: 0.75, height: 0.08, depth: 0.18 }, scene);
        wingL.position = new B.Vector3(-0.55, -0.04, 0.34);
        wingL.rotation.z = -0.25;
        wingL.parent = ship;
        wingL.material = shipMat;
        const wingR = B.MeshBuilder.CreateBox('shipWingR', { width: 0.75, height: 0.08, depth: 0.18 }, scene);
        wingR.position = new B.Vector3(0.55, -0.04, 0.34);
        wingR.rotation.z = 0.25;
        wingR.parent = ship;
        wingR.material = shipMat;
        const engineGlow = B.MeshBuilder.CreateBox('shipEngine', { width: 0.35, height: 0.12, depth: 0.08 }, scene);
        engineGlow.position = new B.Vector3(0, 0, 0.35);
        engineGlow.parent = ship;
        engineGlow.material = shipGlowMat;
        ship.position = new B.Vector3(-120 + Math.random() * 240, 36 + Math.random() * 55, -80 - Math.random() * 150);
        ship.rotation.y = Math.random() * Math.PI * 2;
        ships.push({ node: ship, speed: 7 + Math.random() * 9, lane: i % 3, phase: Math.random() * 100 });
    }

    // ---- BUILDINGS ----
    const buildings = [];
    const buildingColors = {
        Office:     [0.1, 0.2, 0.5],
        Shop:       [0.4, 0.1, 0.2],
        Apartment:  [0.2, 0.15, 0.3],
        Tower:      [0.05, 0.05, 0.15],
        House:      [0.3, 0.2, 0.1],
    };

    function makeBuilding(x, z, type) {
        const h = 3 + Math.random() * 6;
        const w = 2 + Math.random() * 1.5;
        const d = 2 + Math.random() * 1.5;
        const box = B.MeshBuilder.CreateBox('bld', { width: w, height: h, depth: d }, scene);
        box.position = new B.Vector3(x, h / 2, z);
        const m = new B.StandardMaterial('bmat', scene);
        const c = buildingColors[type] || [0.1, 0.1, 0.2];
        m.diffuseColor = new B.Color3(c[0], c[1], c[2]);
        m.emissiveColor = new B.Color3(c[0] * 0.3, c[1] * 0.3, c[2] * 0.3);
        m.specularColor = new B.Color3(0.2, 0.2, 0.3);
        box.material = m;

        const accent = new B.Color3(0.25 + Math.random() * 0.45, 0.45 + Math.random() * 0.35, 0.9);
        const neonMat = new B.StandardMaterial('neonMat', scene);
        neonMat.diffuseColor = new B.Color3(0, 0, 0);
        neonMat.emissiveColor = accent;

        // Window glow strips on front and side faces.
        const winMat = new B.StandardMaterial('winMat', scene);
        winMat.diffuseColor = new B.Color3(0, 0, 0);
        winMat.emissiveColor = new B.Color3(0.2 + Math.random() * 0.5, 0.5 + Math.random() * 0.4, 0.9);
        for (let j = 0; j < 3; j++) {
            const y = h * (0.25 + j * 0.22);
            const wf = B.MeshBuilder.CreateBox('winF', { width: w * 0.55, height: 0.18, depth: 0.04 }, scene);
            wf.position = new B.Vector3(x, y, z - d / 2 - 0.03);
            wf.material = winMat;
            const ws = B.MeshBuilder.CreateBox('winS', { width: 0.04, height: 0.18, depth: d * 0.55 }, scene);
            ws.position = new B.Vector3(x + w / 2 + 0.03, y, z);
            ws.material = winMat;
        }

        // Neon corner spines break the box silhouette.
        for (const sx of [-1, 1]) {
            for (const sz of [-1, 1]) {
                const spine = B.MeshBuilder.CreateBox('spine', { width: 0.08, height: h * 0.92, depth: 0.08 }, scene);
                spine.position = new B.Vector3(x + sx * w / 2, h * 0.48, z + sz * d / 2);
                spine.material = neonMat;
            }
        }

        // Rooftop machinery, signs, and antenna details.
        const roofMat = new B.StandardMaterial('roofMat', scene);
        roofMat.diffuseColor = new B.Color3(c[0] * 0.7, c[1] * 0.7, c[2] * 0.7);
        roofMat.emissiveColor = new B.Color3(c[0] * 0.08, c[1] * 0.08, c[2] * 0.08);
        const roof = B.MeshBuilder.CreateBox('roofUnit', { width: w * 0.45, height: 0.35, depth: d * 0.35 }, scene);
        roof.position = new B.Vector3(x, h + 0.18, z);
        roof.material = roofMat;

        const antenna = B.MeshBuilder.CreateCylinder('antenna', { height: 1.3 + Math.random() * 1.5, diameter: 0.05 }, scene);
        antenna.position = new B.Vector3(x + w * 0.25, h + 0.9, z + d * 0.12);
        antenna.material = neonMat;

        const sign = B.MeshBuilder.CreateBox('sign', { width: w * 0.7, height: 0.35, depth: 0.08 }, scene);
        sign.position = new B.Vector3(x, h * 0.55, z - d / 2 - 0.08);
        sign.material = neonMat;

        if (type === 'Tower') {
            const crown = B.MeshBuilder.CreateBox('crown', { width: w * 0.65, height: 1.1, depth: d * 0.65 }, scene);
            crown.position = new B.Vector3(x, h + 0.85, z);
            crown.material = m;
            const beacon = B.MeshBuilder.CreateSphere('beacon', { diameter: 0.55, segments: 8 }, scene);
            beacon.position = new B.Vector3(x, h + 1.6, z);
            beacon.material = neonMat;
        }

        // Neon edge
        const edges = B.MeshBuilder.CreateLines('edge', {
            points: [
                new B.Vector3(-w/2, 0.05, -d/2), new B.Vector3(w/2, 0.05, -d/2),
                new B.Vector3(w/2, 0.05, d/2), new B.Vector3(-w/2, 0.05, d/2),
                new B.Vector3(-w/2, 0.05, -d/2)
            ]
        }, scene);
        edges.position = new B.Vector3(x, 0, z);
        edges.color = new B.Color3(0.6, 0.3, 1);

        // Click to show info
        box.actionManager = new B.ActionManager(scene);
        box.actionManager.registerAction(new B.ExecuteCodeAction(B.ActionManager.OnPickTrigger, () => {
            terminalLog('Entered <span class="hl">' + type + ' #' + buildings.indexOf(b) + '</span>', 'ok');
        }));

        const b = { mesh: box, edges, x, z, type, h };
        buildings.push(b);
        return b;
    }

    // Grid of buildings
    const types = ['Office', 'Shop', 'Apartment', 'Tower', 'House'];
    const gs = 11, sp = 7, off = (gs - 1) * sp / 2;
    const cityCenter = Math.floor(gs / 2);
    for (let ix = 0; ix < gs; ix++) {
        for (let iz = 0; iz < gs; iz++) {
            if (Math.abs(ix - cityCenter) <= 1 && Math.abs(iz - cityCenter) <= 1) continue;
            if (Math.random() < 0.10) continue;
            const x = ix * sp - off + (Math.random() - 0.5) * 0.5;
            const z = iz * sp - off + (Math.random() - 0.5) * 0.5;
            const type = types[Math.floor(Math.random() * types.length)];
            makeBuilding(x, z, type);
        }
    }

    // ---- SATELLITE TOWNS / DISTRICTS ----
    function makeDistrict(cx, cz, name, accent, shapeBias) {
        const plazaMat = new B.StandardMaterial(name + 'PlazaMat', scene);
        plazaMat.diffuseColor = new B.Color3(accent[0] * 0.12, accent[1] * 0.12, accent[2] * 0.12);
        plazaMat.emissiveColor = new B.Color3(accent[0] * 0.08, accent[1] * 0.08, accent[2] * 0.08);

        const plaza = B.MeshBuilder.CreateCylinder(name + 'Plaza', { diameter: 20, height: 0.12, tessellation: 48 }, scene);
        plaza.position = new B.Vector3(cx, 0.08, cz);
        plaza.material = plazaMat;
        makeInteractive(plaza, name, 'satellite town plaza');

        const archA = B.MeshBuilder.CreateBox(name + 'GateA', { width: 0.4, height: 5, depth: 0.4 }, scene);
        archA.position = new B.Vector3(cx - 5, 2.5, cz - 6);
        archA.material = neon;
        const archB = B.MeshBuilder.CreateBox(name + 'GateB', { width: 0.4, height: 5, depth: 0.4 }, scene);
        archB.position = new B.Vector3(cx + 5, 2.5, cz - 6);

        const archTop = B.MeshBuilder.CreateBox(name + 'GateTop', { width: 10.4, height: 0.35, depth: 0.4 }, scene);
        archTop.position = new B.Vector3(cx, 5, cz - 6);
        archTop.material = neon;

        for (let i = 0; i < 12; i++) {
            const ang = (Math.PI * 2 * i) / 12;
            const r = 9 + Math.random() * 9;
            const x = cx + Math.cos(ang) * r;
            const z = cz + Math.sin(ang) * r;
            const h = 3 + Math.random() * 8;
            let mesh;
            if (shapeBias === 'crystal') {
                mesh = B.MeshBuilder.CreateCylinder(name + 'Crystal', { diameterTop: 0.8, diameterBottom: 2.5, height: h, tessellation: 6 }, scene);

                mesh = B.MeshBuilder.CreateSphere(name + 'Dome', { diameter: 3.2, segments: 12 }, scene);
                mesh.scaling.y = 0.75 + Math.random() * 0.6;
            } else {
                mesh = B.MeshBuilder.CreateBox(name + 'Block', { width: 2 + Math.random(), height: h, depth: 2 + Math.random() }, scene);

            mesh.position = new B.Vector3(x, h / 2, z);

            mat.diffuseColor = new B.Color3(accent[0] * 0.16, accent[1] * 0.16, accent[2] * 0.16);
            mat.emissiveColor = new B.Color3(accent[0] * 0.08, accent[1] * 0.08, accent[2] * 0.08);
            mesh.material = mat;
            const cap = B.MeshBuilder.CreateSphere(name + 'Cap' + i, { diameter: 0.45, segments: 8 }, scene);

    function makePortalDistrict(def) {
        const [ar, ag, ab] = def.accent;

        plazaMat.diffuseColor = new B.Color3(ar * 0.1, ag * 0.1, ab * 0.1);
        plazaMat.emissiveColor = new B.Color3(ar * 0.12, ag * 0.12, ab * 0.12);
        const neon = new B.StandardMaterial(def.name + 'Neon', scene);
        neon.diffuseColor = new B.Color3(0, 0, 0);

        const portalMat = new B.StandardMaterial(def.name + 'Portal', scene);
        portalMat.diffuseColor = new B.Color3(0, 0, 0);
        portalMat.emissiveColor = new B.Color3(ar * 0.6, ag * 0.6, ab * 0.6);

        const cx = def.cx, cz = def.cz;

                pillar.position = new B.Vector3(cx + sx * 4.5, 2.75, cz + sz * 4.5);
                pillar.material = neon;
            }
        }

        // Portal screen — the main dimensional window
        const screen = B.MeshBuilder.CreatePlane(def.name + 'Screen', { width: 7, height: 4.5 }, scene);
        screen.position = new B.Vector3(cx, 2.5, cz);
        screen.material = portalMat;
        screen.actionManager = new B.ActionManager(scene);
        screen.actionManager.registerAction(new B.ExecuteCodeAction(B.ActionManager.OnPickTrigger, () => {

        // Portal frame

        const frame = B.MeshBuilder.CreateBox(def.name + 'FrameBox', { width: 7.4, height: 0.15, depth: 0.15 }, scene);
        frame.position = new B.Vector3(cx, 0.08, cz);
        frame.material = frameMat;

        // Label with canvas texture
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 512; labelCanvas.height = 72;
        const lctx = labelCanvas.getContext('2d');
        lctx.clearRect(0, 0, 512, 72);
        const lgrad = lctx.createLinearGradient(0, 0, 512, 0);
        lgrad.addColorStop(0, 'rgba(' + (ar*255|0) + ',' + (ag*255|0) + ',' + (ab*255|0) + ',0)');
        lgrad.addColorStop(0.15, 'rgba(' + (ar*255|0) + ',' + (ag*255|0) + ',' + (ab*255|0) + ',0.6)');
        lgrad.addColorStop(0.5, 'rgba(' + (ar*255|0) + ',' + (ag*255|0) + ',' + (ab*255|0) + ',0.9)');
        lgrad.addColorStop(0.85, 'rgba(' + (ar*255|0) + ',' + (ag*255|0) + ',' + (ab*255|0) + ',0.6)');
        lgrad.addColorStop(1, 'rgba(' + (ar*255|0) + ',' + (ag*255|0) + ',' + (ab*255|0) + ',0)');
        lctx.fillStyle = lgrad;
        lctx.fillRect(0, 0, 512, 72);
        lctx.fillStyle = '#fff';
        lctx.font = 'bold 28px "Courier New", monospace';
        lctx.textAlign = 'center';
        lctx.textBaseline = 'middle';
        lctx.fillText(def.name, 256, 38);
        const labelTex = new B.Texture(labelCanvas.toDataURL(), scene);

        labelMat.diffuseColor = new B.Color3(0, 0, 0);
        labelMat.emissiveColor = new B.Color3(ar * 0.8, ag * 0.8, ab * 0.8);

        label.position = new B.Vector3(cx, 4.8, cz);
        label.material = labelMat;
        portalLabelMeshes.push({ mesh: label, baseY: 4.8, def });

        // Small district buildings around portal
        for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8 + 0.2;
            const r = 8 + Math.random() * 3;
            const bx = cx + Math.cos(a) * r;
            const bz = cz + Math.sin(a) * r;

            build.position = new B.Vector3(bx, h / 2, bz);

            const bc = [ar * 0.12 + Math.random() * 0.05, ag * 0.12 + Math.random() * 0.05, ab * 0.12 + Math.random() * 0.05];
            bm.diffuseColor = new B.Color3(bc[0], bc[1], bc[2]);
            bm.emissiveColor = new B.Color3(bc[0] * 0.5, bc[1] * 0.5, bc[2] * 0.5);
            build.material = bm;

        for (let s = 0; s < 10; s++) {
            const seg = B.MeshBuilder.CreateBox(def.name + 'Road' + s, { width: 2.4, height: 0.03, depth: 0.3 }, scene);
            const t = 5 + s * 3.2;
            seg.position = new B.Vector3(roadDir.x * t, 0.04, roadDir.z * t);
            const rm = new B.StandardMaterial(def.name + 'RM' + s, scene);
            rm.diffuseColor = new B.Color3(0.01, 0.01, 0.02);
            rm.emissiveColor = new B.Color3(ar * 0.02, ag * 0.02, ab * 0.02);

        makeInteractive(screen, def.name, def.desc);

        // Portal glow light
        const glowLight = new B.PointLight(def.name + 'Glow', new B.Vector3(cx, 3, cz), scene);
        glowLight.intensity = 0.8;
        glowLight.range = 25;
        glowLight.diffuse = new B.Color3(ar, ag, ab);
        portalLights.push({ light: glowLight, phase: Math.random() * Math.PI * 2 });
    }

    function makeCityMaterial(name, color, boost) {
        const m = new B.StandardMaterial(name, scene);
        m.diffuseColor = new B.Color3(color[0] * 0.28, color[1] * 0.28, color[2] * 0.28);
        m.emissiveColor = new B.Color3(color[0] * boost, color[1] * boost, color[2] * boost);
        m.specularColor = new B.Color3(0.35, 0.35, 0.45);
        return m;
    }

    function makeSoulverseBuilding(x, z, h, color, name) {
        const root = new B.TransformNode(name + 'Root');
        root.position = new B.Vector3(x, 0, z);
        const mat = makeCityMaterial(name + 'Mat', color, 0.18);
        const b = B.MeshBuilder.CreateBox(name, { width: 4 + Math.random() * 3, height: h, depth: 4 + Math.random() * 3 }, scene);
        b.position.y = h / 2;
        b.parent = root;
        b.material = mat;
        const winMat = makeCityMaterial(name + 'WinMat', color, 0.75);
        for (let floor = 0; floor < Math.floor(h / 3); floor++) {
            if (Math.random() < 0.35) continue;
            const strip = B.MeshBuilder.CreateBox(name + 'Win' + floor, { width: 2.2, height: 0.18, depth: 0.06 }, scene);
            strip.position = new B.Vector3(0, 1.4 + floor * 3, -2.55);
            strip.parent = root;
            strip.material = winMat;
        }
        const cap = B.MeshBuilder.CreateSphere(name + 'Cap', { diameter: 0.55, segments: 8 }, scene);
        cap.position.y = h + 0.35;
        cap.parent = root;
        cap.material = winMat;
        makeInteractive(b, name, 'Soulverse City building — real geometry copied from the city world');
        return root;
    }

    function makeSoulverseAgent(name, type, start, color) {
        const root = new B.TransformNode('SoulverseAgent' + name);

        aura.material = auraMat;

        body.material = mat;

    function makeMysticalMaterial(name, color, boost, alpha) {
        const m = new B.StandardMaterial(name, scene);
        m.diffuseColor = new B.Color3(color[0] * 0.28, color[1] * 0.28, color[2] * 0.28);
        m.emissiveColor = new B.Color3(color[0] * boost, color[1] * boost, color[2] * boost);
        m.specularColor = new B.Color3(color[0] * 0.4, color[1] * 0.4, color[2] * 0.4);
        if (alpha !== undefined) m.alpha = alpha;
        return m;
    }

    function makeMysticalPlanet(def, i) {
        const pivot = new B.TransformNode('MysticalOrbit' + i);
        pivot.position = new B.Vector3(libraryCenter.x, 13, libraryCenter.z);
        const mat = makeMysticalMaterial('MysticalPlanetMat' + i, def.color, 0.35);
        const planet = B.MeshBuilder.CreateSphere('MysticalPlanet' + i, { diameter: def.size, segments: 24 }, scene);
        planet.position = new B.Vector3(def.x, def.y, def.z);
        planet.parent = pivot;
        planet.material = mat;
        const aura = B.MeshBuilder.CreateSphere('MysticalPlanetAura' + i, { diameter: def.size * 1.95, segments: 16 }, scene);
        aura.position = planet.position.clone();
        aura.parent = pivot;
        aura.material = makeMysticalMaterial('MysticalPlanetAuraMat' + i, def.color, 0.22, 0.22);
        let ring = null;
        if (def.ring) {
            ring = B.MeshBuilder.CreateTorus('MysticalPlanetRing' + i, { diameter: def.size * 1.6, thickness: 0.08, tessellation: 56 }, scene);
            ring.position = planet.position.clone();
            ring.rotation.x = Math.PI / 2.2;
            ring.parent = pivot;
            ring.material = makeMysticalMaterial('MysticalRingMat' + i, def.ringColor || def.color, 0.55, 0.85);
            mysticalRings.push({ mesh: ring, spin: 0.25 + i * 0.03 });
        }
        makeInteractive(planet, 'Mystical Planet ' + (i + 1), 'aura planet grafted from the library sky');
        mysticalPlanets.push({ pivot, planet, aura, speed: def.speed, phase: i });
    }

    function makeMysticalGalaxy(name, x, y, z, radius, colorA, colorB) {
        const root = new B.TransformNode(name);
        root.position = new B.Vector3(x, y, z);
        for (let i = 0; i < 72; i++) {
            const arm = i % 3;
            const t = Math.pow(Math.random(), 0.55) * radius;
            const a = (arm / 3) * Math.PI * 2 + t * 0.45 + (Math.random() - 0.5) * 0.35;
            const blend = t / radius;
            const c = [
                colorA[0] + (colorB[0] - colorA[0]) * blend,
                colorA[1] + (colorB[1] - colorA[1]) * blend,
                colorA[2] + (colorB[2] - colorA[2]) * blend,
            ];
            const dot = B.MeshBuilder.CreateSphere(name + 'Dot' + i, { diameter: 0.18 + Math.random() * 0.18, segments: 6 }, scene);
            dot.position = new B.Vector3(Math.cos(a) * t, (Math.random() - 0.5) * 0.45, Math.sin(a) * t);
            dot.parent = root;
            dot.material = makeMysticalMaterial(name + 'DotMat' + i, c, 0.75, 0.9);
        }
        makeInteractive(root, name, 'spiral galaxy pattern studied from the Mystical Library');
        mysticalGalaxies.push({ node: root, spin: 0.035 + Math.random() * 0.025 });
    }

        heaven() { terminalLog('Heaven resonance: <span class="hl">' + HEAVEN.resonance.toFixed(2) + '</span>. Click Soul Tower Beacon or type <span class="hl">ascend</span>.', 'ok'); },
        ascend() {
            camera.setTarget(new B.Vector3(0, 42, -6));
            camera.radius = 104;
            camera.alpha = -Math.PI / 2.35;
            camera.beta = Math.PI / 3.45;
            HEAVEN.resonance = Math.min(1, HEAVEN.resonance + 0.06);
            PLT.love = Math.min(1, PLT.love + 0.02);
            updateHUD();
            terminalLog('Ascension camera locked on the Heaven layer.', 'ok');
        },
        library() {
            camera.setTarget(new B.Vector3(libraryCenter.x, 2.6, libraryCenter.z - 3));
            camera.radius = 44;
            camera.alpha = -Math.PI / 2.15;
            camera.beta = Math.PI / 3.2;
            terminalLog('Camera moved to the real Mystical Library building.', 'ok');
        },
        soulcity() {
            camera.setTarget(new B.Vector3(soulverseCenter.x, 2, soulverseCenter.z));
            camera.radius = 115;
            camera.alpha = Math.PI / 2.35;
            camera.beta = Math.PI / 3.1;
            terminalLog('Camera moved to adjacent Soulverse City.', 'ok');
        },
        bless() {
            PLT.profit = Math.min(1, PLT.profit + 0.04);
            PLT.love = Math.min(1, PLT.love + 0.06);
            PLT.tax = Math.max(0, PLT.tax - 0.05);
            HEAVEN.resonance = Math.min(1, HEAVEN.resonance + 0.08);
            updateHUD();
            terminalLog('Blessing applied: Profit and Love rise, Tax burns down.', 'ok');
        },
        seraph() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 12 + Math.random() * 18;
            makeSeraph('Seraph ' + (seraphs.length + 1), Math.cos(angle) * radius, 44 + Math.random() * 8, Math.sin(angle) * radius - 12);
            HEAVEN.resonance = Math.min(1, HEAVEN.resonance + 0.03);
            updateHUD();
            terminalLog('A new seraph entered the Soulfeild.', 'ok');
        },
        time(args) {
            if (args[1]) { timeScale = parseFloat(args[1]) || 1; terminalLog('Time: ' + timeScale + 'x', 'ok'); }
            else terminalLog('Time scale: ' + timeScale + 'x');
        },
        pause() { paused = true; terminalLog('Paused.', 'dim'); },
        resume() { paused = false; terminalLog('Resumed.', 'ok'); },
            portals() {
                terminalLog('World Portals: <span class="hl">' + portalDefs.map(d => d.name).join('</span>, <span class="hl">') + '</span>');
                terminalLog('Click a portal screen in a district to enter that world.', 'dim');
            },
            gossip() { terminalLog('The worlds are merging. Each portal is a Soulverse.', 'dim'); },
            spawn() {
            const n = citizenNames[Math.floor(Math.random() * citizenNames.length)] + (citizens.length + 1);
            const c = B.MeshBuilder.CreateSphere('cit' + citizens.length, { diameter: 0.4, segments: 6 }, scene);
            const a = Math.random() * Math.PI * 2;
            const r = 5 + Math.random() * 25;
            c.position = new B.Vector3(Math.cos(a) * r, 0.2, Math.sin(a) * r);
            const cm = new B.StandardMaterial('cm' + citizens.length, scene);
            cm.emissiveColor = new B.Color3(Math.random(), Math.random(), Math.random());
            cm.diffuseColor = new B.Color3(0, 0, 0);
            c.material = cm;
            citizens.push({ mesh: c, target: null, timer: 0, next: 2 + Math.random() * 4, speed: 1 + Math.random() * 2 });
            terminalLog('Spawned ' + n, 'ok');
        },
        build(args) {
            const type = args[1];
            if (type && buildingColors[type]) {
                const a = Math.random() * Math.PI * 2;
                const r = 8 + Math.random() * 25;
                makeBuilding(Math.cos(a) * r, Math.sin(a) * r, type);
                terminalLog('Built ' + type, 'ok');
            } else {
                terminalLog('Usage: build [Office|Shop|Apartment|Tower|House]', 'err');
            }
        },
        exit() { terminalLog('Not inside a building.', 'dim'); }
    };

    termIn.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const cmd = termIn.value.trim();
            if (cmd) {
                const parts = cmd.split(' ');
                const fn = cmds[parts[0].toLowerCase()];
                if (fn) fn(parts); else terminalLog('Unknown: ' + parts[0] + '. Type help.', 'err');
            }
            termIn.value = '';
            updateHUD();
        }
    });

    // ---- STATE ----
    let paused = false;
    let timeScale = 1;
    let heavenTime = 0;

    // ---- RENDER LOOP ----
    scene.registerBeforeRender(() => {
        const dt = engine.getDeltaTime() / 1000;
        if (!paused) {
            const d = dt * timeScale;
            heavenTime += d;

            // Orbit planets
            for (const p of planets) {
                p.pivot.rotation.y += d * p.speed;
            }

            horizonPlanet.rotation.y += d * 0.04;
            horizonRing.rotation.z += d * 0.015;
            for (const sp of skyPlanets) {
                sp.mesh.rotation.y += d * sp.spin;
            }

            heavenGate.rotation.y = Math.sin(heavenTime * 0.28) * 0.08;
            heavenAxis.rotation.y += d * 0.16;
            heavenKeyLight.intensity = 1.0 + HEAVEN.resonance * 0.8 + Math.sin(heavenTime * 1.4) * 0.08;
            heavenLoveLight.intensity = 0.45 + PLT.love * 0.7;
            towerNeonMat.emissiveColor = new B.Color3(0.48 + HEAVEN.resonance * 0.3, 0.22 + PLT.love * 0.22, 0.95);
            for (const h of heavenFloaters) {
                h.node.position.y = h.baseY + Math.sin(heavenTime * h.speed + h.phase) * h.floatAmount;
                h.node.rotation.y += d * h.spin;
            }
            for (const ring of heavenRings) {
                ring.mesh.rotation.z += d * ring.spin;
            }
            for (const pl of portalLights) {
                pl.light.intensity = 0.5 + Math.sin(heavenTime * 1.2 + pl.phase) * 0.4;
            }
            for (const plm of portalLabelMeshes) {
                plm.mesh.position.y = plm.baseY + Math.sin(heavenTime * 0.7 + plm.def.cx) * 0.15;
            }
            for (const kiosk of soulverseKiosks) {
                const pulse = 1 + Math.sin(heavenTime * 1.8 + kiosk.phase) * 0.04;
                kiosk.screen.scaling.set(pulse, pulse, pulse);
            }
            for (const agent of soulverseCityAgents) {
                agent.timer += d;
                if (!agent.target || agent.timer > agent.next) {
                    const keys = Object.keys(soulverseDistricts);
                    const district = soulverseDistricts[keys[Math.floor(Math.random() * keys.length)]];
                    agent.target = district.pos.add(new B.Vector3((Math.random() - 0.5) * 14, 0, (Math.random() - 0.5) * 14));
                    agent.timer = 0;
                    agent.next = 4 + Math.random() * 7;
                }
                const dir = agent.target.subtract(agent.node.position);
                dir.y = 0;
                if (dir.length() > 0.5) {
                    dir.normalize().scaleInPlace(agent.speed * d);
                    agent.node.position.addInPlace(dir);
                    agent.node.rotation.y = Math.atan2(dir.x, dir.z);
                }
                agent.node.position.y = Math.sin(heavenTime * 4 + agent.phase) * 0.04;
                const agentPulse = 1 + Math.sin(heavenTime * 2 + agent.phase) * 0.08;
                agent.aura.scaling.set(agentPulse, agentPulse, agentPulse);
                agent.halo.rotation.z += d * 0.9;
            }
            for (const mp of mysticalPlanets) {
                mp.pivot.rotation.y += d * mp.speed;
                mp.planet.rotation.y += d * 0.25;
                const auraScale = 1 + Math.sin(heavenTime * 1.2 + mp.phase) * 0.05;
                mp.aura.scaling.set(auraScale, auraScale, auraScale);
            }
            for (const ring of mysticalRings) {
                ring.mesh.rotation.z += d * ring.spin;
            }
            for (const g of mysticalGalaxies) {
                g.node.rotation.y += d * g.spin;
            }
            for (const soul of mysticalSouls) {
                const t = heavenTime * soul.speed + soul.phase;
                soul.mesh.position.x = soul.base.x + Math.cos(t) * soul.orbit;
                soul.mesh.position.y = soul.base.y + Math.sin(t * 1.6) * 0.35;
                soul.mesh.position.z = soul.base.z + Math.sin(t) * soul.orbit;
                const soulPulse = 1 + Math.sin(t * 2.2) * 0.08;
                soul.mesh.scaling.set(soulPulse, soulPulse, soulPulse);
            }
            for (const page of mysticalPages) {
                page.mesh.position.y = page.base.y + Math.sin(heavenTime * page.speed + page.phase) * 0.45;
                page.mesh.rotation.y += d * 0.45;
                page.mesh.rotation.z += d * 0.25;
            }
            for (const reader of libraryReaders) {
                reader.timer += d;
                if (!reader.target || reader.timer > reader.next) {
                    reader.target = libraryReadingSpots[Math.floor(Math.random() * libraryReadingSpots.length)].clone();
                    reader.mode = Math.random() < 0.65 ? 'read' : 'browse';
                    reader.timer = 0;
                    reader.next = reader.mode === 'read' ? 5 + Math.random() * 6 : 3 + Math.random() * 4;
                    reader.book.isVisible = false;
                }
                const dir = reader.target.subtract(reader.node.position);
                dir.y = 0;
                if (dir.length() > 0.35) {
                    dir.normalize().scaleInPlace(reader.speed * d);
                    reader.node.position.addInPlace(dir);
                    reader.node.rotation.y = Math.atan2(dir.x, dir.z);
                    reader.book.isVisible = false;
                } else {
                    reader.book.isVisible = reader.mode === 'read';
                    reader.head.rotation.x = Math.sin(heavenTime * 2.4 + reader.phase) * 0.12;
                    reader.book.rotation.y = Math.sin(heavenTime * 1.8 + reader.phase) * 0.08;
                }
            }
            for (const s of seraphs) {
                const t = heavenTime * s.speed + s.phase;
                s.node.position.x = s.base.x + Math.cos(t) * s.orbit;
                s.node.position.y = s.base.y + Math.sin(t * 1.7) * 0.6;
                s.node.position.z = s.base.z + Math.sin(t) * s.orbit;
                s.node.rotation.y = -t + Math.PI / 2;
            }

            for (const ship of ships) {
                ship.phase += d;
                ship.node.position.x += Math.cos(ship.lane) * ship.speed * d;
                ship.node.position.z += Math.sin(ship.lane + 0.4) * ship.speed * d;
                ship.node.position.y += Math.sin(ship.phase * 1.5) * 0.015;
                ship.node.rotation.y = Math.atan2(Math.cos(ship.lane), Math.sin(ship.lane + 0.4));
                if (ship.node.position.x > 150 || ship.node.position.z > 40) {
                    ship.node.position.x = -150;
                    ship.node.position.z = -160 - Math.random() * 80;
                    ship.node.position.y = 36 + Math.random() * 55;
                }
            }

            for (const car of cars) {
                if (car.axis === 'x') {
                    car.node.position.x += car.speed * car.dir * d;
                    if (car.node.position.x > 86) car.node.position.x = -86;
                    if (car.node.position.x < -86) car.node.position.x = 86;
                    car.node.rotation.y = car.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
                } else {
                    car.node.position.z += car.speed * car.dir * d;
                    if (car.node.position.z > 86) car.node.position.z = -86;
                    if (car.node.position.z < -86) car.node.position.z = 86;
                    car.node.rotation.y = car.dir > 0 ? 0 : Math.PI;
                }
            }

            // Drift PLT
            PLT.profit = Math.max(0, Math.min(1, PLT.profit + (Math.random() - 0.5) * d * 0.01));
            PLT.love = Math.max(0, Math.min(1, PLT.love + (Math.random() - 0.5) * d * 0.01));
            PLT.tax = Math.max(0, Math.min(1, PLT.tax + (Math.random() - 0.5) * d * 0.01));
            updateHUD();

            // Subtle sky tint from PLT
            scene.clearColor = new B.Color3(
                0.02 + PLT.profit * 0.02,
                0.01 + PLT.love * 0.02,
                0.05 + PLT.tax * 0.02
            );

            // Move citizens
            for (const c of citizens) {
                c.timer += d;
                if (c.timer > c.next) {
                    c.timer = 0;
                    c.next = 2 + Math.random() * 4;
                    const a = Math.random() * Math.PI * 2;
                    const r = 4 + Math.random() * 25;
                    c.target = new B.Vector3(Math.cos(a) * r, 0.2, Math.sin(a) * r);
                }
                if (c.target) {
                    const dir = c.target.subtract(c.mesh.position);
                    if (dir.length() > 0.3) {
                        dir.normalize().scaleInPlace(c.speed * d);
                        c.mesh.position.addInPlace(dir);
                    } else { c.target = null; }
                }
            }

            for (const a of aliens) {
                a.timer += d;
                if (a.timer > a.next) {
                    a.timer = 0;
                    a.next = 1.5 + Math.random() * 4;
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 5 + Math.random() * 42;
                    a.target = new B.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                }
                if (a.target) {
                    const dir = a.target.subtract(a.node.position);
                    if (dir.length() > 0.4) {
                        dir.normalize().scaleInPlace(a.speed * d);
                        a.node.position.addInPlace(dir);
                        a.node.rotation.y = Math.atan2(dir.x, dir.z);
                    } else {
                        a.target = null;
                    }
                }
                a.node.position.y = Math.sin(a.timer * 5) * 0.03;
            }

            for (const h of humans) {
                h.timer += d;
                if (h.timer > h.next) {
                    h.timer = 0;
                    h.next = 2 + Math.random() * 5;
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 6 + Math.random() * 48;
                    h.target = new B.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                }
                if (h.target) {
                    const dir = h.target.subtract(h.node.position);
                    if (dir.length() > 0.35) {
                        dir.normalize().scaleInPlace(h.speed * d);
                        h.node.position.addInPlace(dir);
                        h.node.rotation.y = Math.atan2(dir.x, dir.z);
                    } else {
                        h.target = null;
                    }
                }
                h.node.position.y = Math.sin(h.timer * 7) * 0.015;
            }

            for (const r of robots) {
                r.timer += d;
                if (r.timer > r.next) {
                    r.timer = 0;
                    r.next = 1.2 + Math.random() * 3.5;
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 6 + Math.random() * 50;
                    r.target = new B.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                }
                if (r.target) {
                    const dir = r.target.subtract(r.node.position);
                    if (dir.length() > 0.35) {
                        dir.normalize().scaleInPlace(r.speed * d);
                        r.node.position.addInPlace(dir);
                        r.node.rotation.y = Math.atan2(dir.x, dir.z);
                    } else {
                        r.target = null;
                    }
                }
            }
        }
    });

    window.addEventListener('resize', () => engine.resize());
    engine.runRenderLoop(() => scene.render());

    terminalLog('The Soulfeild loaded.');
    terminalLog('Drag to orbit. Scroll to zoom. Click buildings.');
    terminalLog('Heaven layer online. Type <span class="hl">ascend</span> or <span class="hl">bless</span>.', 'ok');
    terminalLog('6 world portals active. Type <span class="hl">portals</span> to list them.', 'ok');
    terminalLog('Real Soulverse City added. Type <span class="hl">soulcity</span>. Real Mystical Library added. Type <span class="hl">library</span>.', 'ok');
    terminalLog('Type <span class="hl">help</span> for commands.');
    console.log('Soulfeild ready.');
    </script>
</body>
</html>
