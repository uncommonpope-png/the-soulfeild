<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soulfeild</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; outline: none; }

        #hud {
            position: fixed; top: 20px; right: 20px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 16px 20px;
            color: #c0d8e0; font-family: 'Courier New', monospace;
            font-size: 13px; z-index: 90; min-width: 160px;
            pointer-events: none; user-select: none;
        }
        #hud .hud-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; margin-bottom: 8px; }
        .hud-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .hud-row .label { opacity: 0.4; font-size: 11px; }
        .hud-row .value { font-weight: bold; }
        .plt-profit .value { color: #ffb347; }
        .plt-love .value { color: #ff6b9d; }
        .plt-tax .value { color: #4ecdc4; }
        .plt-total .value { color: #e0e8ff; font-size: 16px; }
        .hud-divider { border-top: 1px solid rgba(255,255,255,0.06); margin: 4px 0; }

        #terminal {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 86%; max-width: 800px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;
            padding: 12px 16px; color: #b0d0e0; font-size: 14px;
            font-family: 'Courier New', monospace; z-index: 100;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        #terminal-output { max-height: 120px; overflow-y: auto; margin-bottom: 6px; line-height: 1.5; }
        #terminal-output::-webkit-scrollbar { width: 4px; }
        #terminal-output::-webkit-scrollbar-thumb { background: #4a6a8a; border-radius: 8px; }
        .term-line .hl { color: #f0c060; }
        .term-line .ok { color: #60d0a0; }
        .term-line .err { color: #e06060; }
        .term-line .dim { opacity: 0.5; }
        #terminal-input-line { display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 6px; }
        #terminal-prompt { color: #8ab0d0; font-weight: bold; }
        #terminal-input { flex: 1; background: transparent; border: none; color: #e0f0f8; font: inherit; outline: none; padding: 4px 0; }
        #terminal-input::placeholder { color: #3a5a6a; font-style: italic; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="hud">
        <div class="hud-title">Soulfeild Pulse</div>
        <div class="hud-row plt-profit"><span class="label">Profit</span><span class="value" id="hud-profit">0.50</span></div>
        <div class="hud-row plt-love"><span class="label">Love</span><span class="value" id="hud-love">0.50</span></div>
        <div class="hud-row plt-tax"><span class="label">Tax</span><span class="value" id="hud-tax">0.50</span></div>
        <div class="hud-divider"></div>
        <div class="hud-row plt-total"><span class="label">PLT</span><span class="value" id="hud-total">0.50</span></div>
    </div>

    <div id="terminal">
        <div id="terminal-output">
            <div class="term-line">> <span class="hl">The Soulfeild</span> v1.0</div>
            <div class="term-line">> Click a building to enter. Explore the cosmos.</div>
        </div>
        <div id="terminal-input-line">
            <span id="terminal-prompt">></span>
            <input id="terminal-input" type="text" placeholder="command..." autofocus />
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
    const B = window.BABYLON;
    const canvas = document.getElementById('renderCanvas');
    const engine = new B.Engine(canvas, true, { antialiasing: true });
    const scene = new B.Scene(engine);
    scene.clearColor = new B.Color3(0.02, 0.01, 0.05);

    // Camera -- ArcRotate for nice orbit
    const camera = new B.ArcRotateCamera('cam', -Math.PI / 2.5, Math.PI / 3, 50, B.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 5;
    camera.upperRadiusLimit = 200;
    camera.wheelDeltaPercentage = 0.01;

    // Lights
    const hemi = new B.HemisphericLight('hemi', new B.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.3;
    hemi.groundColor = new B.Color3(0.1, 0.05, 0.2);
    const dir = new B.DirectionalLight('dir', new B.Vector3(0.5, -1, 0.3), scene);
    dir.intensity = 0.8;

    // Bloom
    const pipe = new B.DefaultRenderingPipeline('pipe', true, scene, [camera]);
    pipe.bloomEnabled = true;
    pipe.bloomThreshold = 0.3;
    pipe.bloomWeight = 0.8;
    pipe.bloomKernel = 32;
    pipe.fxaaEnabled = true;
    pipe.depthOfFieldEnabled = false;
    pipe.vignetteEnabled = true;
    pipe.vignetteWeight = 0.8;

    // ---- GROUND ----
    const ground = B.MeshBuilder.CreateGround('ground', { width: 200, height: 200 }, scene);
    const gMat = new B.StandardMaterial('gMat', scene);
    gMat.diffuseColor = new B.Color3(0.02, 0.02, 0.04);
    gMat.specularColor = new B.Color3(0.1, 0.1, 0.2);
    gMat.emissiveColor = new B.Color3(0.01, 0.005, 0.02);
    ground.material = gMat;

    // ---- NEON GRID ----
    const grid = B.MeshBuilder.CreateGround('grid', { width: 160, height: 160, subdivisions: 20 }, scene);
    const gridMat = new B.StandardMaterial('gridMat', scene);
    gridMat.wireframe = true;
    gridMat.emissiveColor = new B.Color3(0.1, 0.04, 0.2);
    gridMat.diffuseColor = new B.Color3(0, 0, 0);
    gridMat.alpha = 0.3;
    grid.position.y = 0.02;
    grid.material = gridMat;

    // ---- FOG (subtle) ----
    scene.fogMode = B.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.003;
    scene.fogColor = new B.Color3(0.02, 0.01, 0.05);

    // ---- STARS ----
    const stars = new B.ParticleSystem('stars', 12000, scene);
    stars.particleTexture = new B.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
    stars.createSphereEmitter(15000, 0);
    stars.manualEmitCount = 12000;
    stars.minLifeTime = 999999;
    stars.maxLifeTime = 999999;
    stars.minSize = 1;
    stars.maxSize = 4;
    stars.minEmitPower = 0;
    stars.maxEmitPower = 0;
    stars.color1 = new B.Color4(0.9, 0.9, 1, 1);
    stars.color2 = new B.Color4(0.7, 0.8, 1, 0.8);
    stars.colorDead = new B.Color4(0, 0, 0, 0);
    stars.blendMode = B.ParticleSystem.BLENDMODE_ADD;
    stars.start();

    // ---- SOLAR SYSTEM ----
    const sun = B.MeshBuilder.CreateSphere('sun', { diameter: 8, segments: 24 }, scene);
    sun.position = new B.Vector3(0, 90, -180);
    const sunMat = new B.StandardMaterial('sunMat', scene);
    sunMat.emissiveColor = new B.Color3(1, 0.8, 0.3);
    sunMat.diffuseColor = new B.Color3(0, 0, 0);
    sunMat.specularColor = new B.Color3(0, 0, 0);
    sun.material = sunMat;

    const sunGlow = new B.PointLight('sunLight', sun.position.clone(), scene);
    sunGlow.intensity = 2;
    sunGlow.range = 500;
    sunGlow.diffuse = new B.Color3(1, 0.8, 0.4);

    const planetColors = [
        [0.9, 0.3, 0.2], [0.2, 0.7, 0.9], [0.9, 0.6, 0.1],
        [0.4, 0.3, 0.7], [0.3, 0.7, 0.5]
    ];
    const planets = [];
    planetColors.forEach((c, i) => {
        const radius = 18 + i * 12;
        const pivot = new B.TransformNode('orbit' + i);
        pivot.position = sun.position.clone();
        const p = B.MeshBuilder.CreateSphere('planet' + i, { diameter: 1.2 + i * 0.3, segments: 16 }, scene);
        p.position = new B.Vector3(radius, 0, 0);
        p.parent = pivot;
        const pm = new B.StandardMaterial('pm' + i, scene);
        pm.diffuseColor = new B.Color3(c[0], c[1], c[2]);
        pm.emissiveColor = new B.Color3(c[0] * 0.15, c[1] * 0.15, c[2] * 0.15);
        pm.specularColor = new B.Color3(0.1, 0.1, 0.1);
        p.material = pm;
        planets.push({ pivot, speed: 0.3 - i * 0.04 });
    });

    // ---- BUILDINGS ----
    const buildings = [];
    const buildingColors = {
        Office:     [0.1, 0.2, 0.5],
        Shop:       [0.4, 0.1, 0.2],
        Apartment:  [0.2, 0.15, 0.3],
        Tower:      [0.05, 0.05, 0.15],
        House:      [0.3, 0.2, 0.1],
    };

    function makeBuilding(x, z, type) {
        const h = 3 + Math.random() * 6;
        const w = 2 + Math.random() * 1.5;
        const d = 2 + Math.random() * 1.5;
        const box = B.MeshBuilder.CreateBox('bld', { width: w, height: h, depth: d }, scene);
        box.position = new B.Vector3(x, h / 2, z);
        const m = new B.StandardMaterial('bmat', scene);
        const c = buildingColors[type] || [0.1, 0.1, 0.2];
        m.diffuseColor = new B.Color3(c[0], c[1], c[2]);
        m.emissiveColor = new B.Color3(c[0] * 0.3, c[1] * 0.3, c[2] * 0.3);
        m.specularColor = new B.Color3(0.2, 0.2, 0.3);
        box.material = m;

        // Neon edge
        const edges = B.MeshBuilder.CreateLines('edge', {
            points: [
                new B.Vector3(-w/2, 0.05, -d/2), new B.Vector3(w/2, 0.05, -d/2),
                new B.Vector3(w/2, 0.05, d/2), new B.Vector3(-w/2, 0.05, d/2),
                new B.Vector3(-w/2, 0.05, -d/2)
            ]
        }, scene);
        edges.position = new B.Vector3(x, 0, z);
        edges.color = new B.Color3(0.6, 0.3, 1);

        // Click to show info
        box.actionManager = new B.ActionManager(scene);
        box.actionManager.registerAction(new B.ExecuteCodeAction(B.ActionManager.OnPickTrigger, () => {
            terminalLog('Entered <span class="hl">' + type + ' #' + buildings.indexOf(b) + '</span>', 'ok');
        }));

        const b = { mesh: box, edges, x, z, type, h };
        buildings.push(b);
        return b;
    }

    // Grid of buildings
    const types = ['Office', 'Shop', 'Apartment', 'Tower', 'House'];
    const gs = 8, sp = 7, off = (gs - 1) * sp / 2;
    for (let ix = 0; ix < gs; ix++) {
        for (let iz = 0; iz < gs; iz++) {
            if (ix === 4 && iz === 4) continue;
            if (Math.random() < 0.12) continue;
            const x = ix * sp - off + (Math.random() - 0.5) * 0.5;
            const z = iz * sp - off + (Math.random() - 0.5) * 0.5;
            const type = types[Math.floor(Math.random() * types.length)];
            makeBuilding(x, z, type);
        }
    }

    // ---- STREET LAMPS ----
    for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 8 + Math.random() * 28;
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        const lp = B.MeshBuilder.CreateSphere('lamp' + i, { diameter: 0.3 }, scene);
        lp.position = new B.Vector3(x, 1.5, z);
        const lm = new B.StandardMaterial('lm' + i, scene);
        lm.emissiveColor = new B.Color3(0.8, 0.3, 1);
        lm.diffuseColor = new B.Color3(0, 0, 0);
        lp.material = lm;
        const pl = new B.PointLight('pl' + i, new B.Vector3(x, 1.5, z), scene);
        pl.intensity = 0.5;
        pl.range = 5;
        pl.diffuse = new B.Color3(0.6, 0.3, 0.9);
    }

    // ---- CITIZENS ----
    const citizens = [];
    const citizenNames = ['Elara','Kael','Lyra','Orin','Sera','Dorian','Faye','Gideon','Iris','Jasper','Luna','Milo'];
    for (let i = 0; i < 25; i++) {
        const c = B.MeshBuilder.CreateSphere('cit' + i, { diameter: 0.4, segments: 6 }, scene);
        const a = Math.random() * Math.PI * 2;
        const r = 5 + Math.random() * 25;
        c.position = new B.Vector3(Math.cos(a) * r, 0.2, Math.sin(a) * r);
        const cm = new B.StandardMaterial('cm' + i, scene);
        cm.emissiveColor = new B.Color3(Math.random(), Math.random(), Math.random());
        cm.diffuseColor = new B.Color3(0, 0, 0);
        c.material = cm;
        citizens.push({ mesh: c, target: null, timer: 0, next: 2 + Math.random() * 4, speed: 1 + Math.random() * 2 });
    }

    // ---- PLT ----
    const PLT = { profit: 0.55, love: 0.45, tax: 0.50 };
    Object.defineProperty(PLT, 'total', { get() { return Math.min(1, Math.max(0, this.profit + this.love - this.tax)); } });

    // ---- TERMINAL ----
    const termOut = document.getElementById('terminal-output');
    const termIn = document.getElementById('terminal-input');

    function terminalLog(msg, cls) {
        const d = document.createElement('div');
        d.className = 'term-line' + (cls ? ' ' + cls : '');
        d.innerHTML = '> ' + msg;
        termOut.appendChild(d);
        termOut.scrollTop = termOut.scrollHeight;
    }

    function updateHUD() {
        document.getElementById('hud-profit').textContent = PLT.profit.toFixed(2);
        document.getElementById('hud-love').textContent = PLT.love.toFixed(2);
        document.getElementById('hud-tax').textContent = PLT.tax.toFixed(2);
        document.getElementById('hud-total').textContent = PLT.total.toFixed(2);
    }
    updateHUD();

    const cmds = {
        help() { terminalLog('Commands: <span class="hl">plt</span>, <span class="hl">time</span> [speed], <span class="hl">pause</span>, <span class="hl">resume</span>, <span class="hl">spawn</span>, <span class="hl">build</span> [type], <span class="hl">exit</span>'); },
        plt() { terminalLog('Profit: ' + PLT.profit.toFixed(2) + '  Love: ' + PLT.love.toFixed(2) + '  Tax: ' + PLT.tax.toFixed(2) + '  <span class="hl">Total: ' + PLT.total.toFixed(2) + '</span>'); },
        time(args) {
            if (args[1]) { timeScale = parseFloat(args[1]) || 1; terminalLog('Time: ' + timeScale + 'x', 'ok'); }
            else terminalLog('Time scale: ' + timeScale + 'x');
        },
        pause() { paused = true; terminalLog('Paused.', 'dim'); },
        resume() { paused = false; terminalLog('Resumed.', 'ok'); },
        spawn() {
            const n = citizenNames[Math.floor(Math.random() * citizenNames.length)] + (citizens.length + 1);
            const c = B.MeshBuilder.CreateSphere('cit' + citizens.length, { diameter: 0.4, segments: 6 }, scene);
            const a = Math.random() * Math.PI * 2;
            const r = 5 + Math.random() * 25;
            c.position = new B.Vector3(Math.cos(a) * r, 0.2, Math.sin(a) * r);
            const cm = new B.StandardMaterial('cm' + citizens.length, scene);
            cm.emissiveColor = new B.Color3(Math.random(), Math.random(), Math.random());
            cm.diffuseColor = new B.Color3(0, 0, 0);
            c.material = cm;
            citizens.push({ mesh: c, target: null, timer: 0, next: 2 + Math.random() * 4, speed: 1 + Math.random() * 2 });
            terminalLog('Spawned ' + n, 'ok');
        },
        build(args) {
            const type = args[1];
            if (type && buildingColors[type]) {
                const a = Math.random() * Math.PI * 2;
                const r = 8 + Math.random() * 25;
                makeBuilding(Math.cos(a) * r, Math.sin(a) * r, type);
                terminalLog('Built ' + type, 'ok');
            } else {
                terminalLog('Usage: build [Office|Shop|Apartment|Tower|House]', 'err');
            }
        },
        exit() { terminalLog('Not inside a building.', 'dim'); }
    };

    termIn.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const cmd = termIn.value.trim();
            if (cmd) {
                const parts = cmd.split(' ');
                const fn = cmds[parts[0].toLowerCase()];
                if (fn) fn(parts); else terminalLog('Unknown: ' + parts[0] + '. Type help.', 'err');
            }
            termIn.value = '';
            updateHUD();
        }
    });

    // ---- STATE ----
    let paused = false;
    let timeScale = 1;

    // ---- RENDER LOOP ----
    scene.registerBeforeRender(() => {
        const dt = engine.getDeltaTime() / 1000;
        if (!paused) {
            const d = dt * timeScale;

            // Orbit planets
            for (const p of planets) {
                p.pivot.rotation.y += d * p.speed;
            }

            // Drift PLT
            PLT.profit = Math.max(0, Math.min(1, PLT.profit + (Math.random() - 0.5) * d * 0.01));
            PLT.love = Math.max(0, Math.min(1, PLT.love + (Math.random() - 0.5) * d * 0.01));
            PLT.tax = Math.max(0, Math.min(1, PLT.tax + (Math.random() - 0.5) * d * 0.01));
            updateHUD();

            // Subtle sky tint from PLT
            scene.clearColor = new B.Color3(
                0.02 + PLT.profit * 0.02,
                0.01 + PLT.love * 0.02,
                0.05 + PLT.tax * 0.02
            );

            // Move citizens
            for (const c of citizens) {
                c.timer += d;
                if (c.timer > c.next) {
                    c.timer = 0;
                    c.next = 2 + Math.random() * 4;
                    const a = Math.random() * Math.PI * 2;
                    const r = 4 + Math.random() * 25;
                    c.target = new B.Vector3(Math.cos(a) * r, 0.2, Math.sin(a) * r);
                }
                if (c.target) {
                    const dir = c.target.subtract(c.mesh.position);
                    if (dir.length() > 0.3) {
                        dir.normalize().scaleInPlace(c.speed * d);
                        c.mesh.position.addInPlace(dir);
                    } else { c.target = null; }
                }
            }
        }
    });

    window.addEventListener('resize', () => engine.resize());
    engine.runRenderLoop(() => scene.render());

    terminalLog('The Soulfeild loaded.');
    terminalLog('Drag to orbit. Scroll to zoom. Click buildings.');
    terminalLog('Type <span class="hl">help</span> for commands.');
    console.log('Soulfeild ready.');
    </script>
</body>
</html>
